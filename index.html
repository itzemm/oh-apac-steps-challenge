  renderAppShell(){
    const me = this.state.users[this.state.identity.uid] || { role:'user' };
    const status = this.getChallengeStatus();
    const cfg = this.state.config;
    let statusLabel = 'Not started yet';
    if(status.started && !status.ended) statusLabel = `Week ${status.weekIndex+1} of ${cfg.weeks}`;
    if(status.ended) statusLabel = 'Challenge complete';

    return `
      <div class="header">
        <div>
          <div class="title serif"><img class="header-logo" src="assets/otters/otter-lion.png" alt="">${cfg.name || 'OH APAC Steps Challenge'}</div>
          <div class="who">${this.state.identity.name} &nbsp;·&nbsp; <button id="btn-switch">sign out</button></div>
        </div>
        <div class="status-pill">${statusLabel}</div>
      </div>
      <div class="tabs">
        <div class="tab ${this.state.view==='trail'?'active':''}" data-view="trail">My trail</div>
        <div class="tab ${this.state.view==='myteam'?'active':''}" data-view="myteam">My team</div>
        <div class="tab ${this.state.view==='leaderboard'?'active':''}" data-view="leaderboard">Leaderboard</div>
        ${me.role==='admin' ? `<div class="tab ${this.state.view==='admin'?'active':''}" data-view="admin">Admin</div>` : ''}
      </div>
      <div id="tab-body">
        ${this.state.view==='trail' ? this.renderTrail() : ''}
        ${this.state.view==='myteam' ? this.renderMyTeam() : ''}
        ${this.state.view==='leaderboard' ? this.renderLeaderboard() : ''}
        ${this.state.view==='admin' && me.role==='admin' ? this.renderAdmin() : ''}
      </div>
      ${this.state.modal ? this.renderModal() : ''}
    `;
  },

  renderTrail(){
    const cfg = this.state.config;
    const status = this.getChallengeStatus();
    const myTotal = this.totalStepsOf(this.state.mySteps);

    if(!status.started){
      return `<div class="panel"><div class="empty">${cfg.startDate ? `The challenge starts on ${cfg.startDate} (Singapore time). Check back then.` : "The admin hasn't set a start date yet. Check back soon."}</div></div>`;
    }

    // Start, one stop per week, End — evenly spaced (see .trail-dot-wrap,
    // which gives every stop equal flex so the gaps stay identical instead
    // of the last one shrinking to fit its own content).
    const stops = [{ kind:'start', label:'Start' }];
    for(let w=0; w<cfg.weeks; w++) stops.push({ kind:'week', label:'Week '+(w+1), weekIndex:w });
    stops.push({ kind:'end', label:'End' });

    const stopFilled = (stop) => {
      if(stop.kind === 'start') return true;
      if(stop.kind === 'end') return status.ended;
      return this.totalStepsInRange(this.state.mySteps, stop.weekIndex) > 0;
    };

    let trailHtml = `<div class="trail"><div class="trail-track">`;
    stops.forEach((stop, i) => {
      let dotClass = 'week-dot';
      let otterMarker = '';
      if(stop.kind === 'start'){
        dotClass += ' done';
      } else if(stop.kind === 'end'){
        dotClass += status.ended ? ' done' : ' upcoming';
      } else {
        const weekTotal = this.totalStepsInRange(this.state.mySteps, stop.weekIndex);
        const proof = this.weekProofOf(this.state.myProofs, stop.weekIndex);
        const wStatus = this.getWeekStatus(stop.weekIndex);
        const isCurrentWeek = stop.weekIndex === status.weekIndex && !status.ended;
        if(weekTotal) dotClass += proof ? ' done' : ' partial';
        if(isCurrentWeek) dotClass += ' today';
        if(wStatus === 'future') dotClass += ' upcoming';
        otterMarker = isCurrentWeek ? `<img class="trail-otter" src="assets/otters/otter-lion.png" alt="">` : '';
      }
      const lineBefore = i>0 ? `<div class="trail-line${stopFilled(stops[i-1])?' filled':''}"></div>` : '<div style="flex:none;width:0;"></div>';
      const lineAfter = i<stops.length-1 ? `<div class="trail-line${stopFilled(stop)?' filled':''}"></div>` : '<div style="flex:none;width:0;"></div>';
      trailHtml += `<div class="trail-dot-wrap">${otterMarker}<div class="trail-line-row">${lineBefore}<div class="${dotClass}"></div>${lineAfter}</div><div class="trail-dot-label">${stop.label}</div></div>`;
    });
    trailHtml += `</div></div>`;

    // Whichever open week's deadline is soonest — normally just the current
    // week, but during the Monday-morning grace window the PREVIOUS week is
    // also still 'editable' and locks first (today, not weeks from now), so
    // that's the one worth calling out.
    let deadlineHtml = '';
    const openWeeks = [];
    for(let w=0; w<cfg.weeks; w++){ if(this.getWeekStatus(w) === 'editable') openWeeks.push(w); }
    if(openWeeks.length){
      const soonest = openWeeks.reduce((a,b) => this.weekDeadline(a) < this.weekDeadline(b) ? a : b);
      const deadlineLabel = this.formatDate(this.addDays(cfg.startDate, soonest*7 + 7)) + ', 12pm';
      deadlineHtml = `<div class="notice" style="margin-bottom:18px;">⏰ <strong>Deadline:</strong> submit Week ${soonest+1}'s steps and proof photo by <strong>${deadlineLabel}</strong> (Singapore time). After that, Week ${soonest+1} will be <strong>locked</strong> — no further changes can be made.</div>`;
    }

    const funHtml = this.renderFunStats(this.getFunFacts('my', myTotal));

    const myTeam = this.getMyTeam();
    const bonusList = Object.values(this.state.bonus).filter(b => b.active !== false && this.isBonusVisibleNow(b));
    let bonusHtml = '';
    if(bonusList.length){
      bonusHtml = `<div class="panel"><h3>Bonus challenges available</h3>` + bonusList.map(b => {
        const isTeamType = b.type === 'team';
        const targetId = isTeamType ? (myTeam ? myTeam.id : null) : this.state.identity.uid;
        const joinPrompt = isTeamType && !myTeam ? 'Join a team to work toward this' : null;
        return this.renderBonusCard(b, targetId, joinPrompt);
      }).join('') + `</div>`;
    }

    const activeWeek = status.ended ? cfg.weeks - 1 : status.weekIndex;
    let weekCards = '<div class="week-list">';
    for(let w=0; w<=activeWeek; w++){
      weekCards += this.renderWeekCard(w);
    }
    weekCards += '</div>';

    return trailHtml + deadlineHtml + funHtml + bonusHtml + weekCards;
  },

  renderWeekCard(weekIndex){
    const cfg = this.state.config;
    const wStatus = this.getWeekStatus(weekIndex);
    const weekTotal = this.totalStepsInRange(this.state.mySteps, weekIndex);
    const proofEntry = this.weekProofOf(this.state.myProofs, weekIndex);
    const dateRange = cfg.startDate ? this.weekDateRange(weekIndex) : '';
    const isLocked = wStatus === 'locked';

    // Past weeks can't be amended, only viewed — collapsed to a compact
    // status box by default so the page doesn't get long once the challenge
    // starts stacking up locked weeks; click it to review the read-only detail.
    if(isLocked && !this.state.trailExpandedWeeks[weekIndex]){
      const review = this.state.mySteps.verified && this.state.mySteps.verified[weekIndex];
      const reviewStatus = review ? review.status : 'pending';
      return `<div class="locked-week" data-role="toggle-week-expand" data-week="${weekIndex}">
        <div class="locked-week-label">Week ${weekIndex+1}<span class="locked-week-total"> — ${weekTotal.toLocaleString()} steps</span></div>
        <span class="status-pill status-${reviewStatus}">${REVIEW_STATUS_META[reviewStatus].label}</span>
      </div>`;
    }

    let tag = '';
    if(wStatus === 'locked') tag = `<span class="tag tag-locked">Locked</span>`;
    else if(wStatus === 'editable'){
      const status = this.getChallengeStatus();
      const isGraceWeek = weekIndex !== status.weekIndex || status.ended;
      tag = isGraceWeek
        ? `<span class="tag tag-editable">Open until Mon ${this.formatDate(this.addDays(cfg.startDate, weekIndex*7+7))}, 12pm</span>`
        : `<span class="tag tag-editable">Open</span>`;
    }
    else if(wStatus === 'future') tag = `<span class="tag tag-upcoming">Not yet</span>`;

    let proofRow = '';
    if(wStatus === 'editable'){
      proofRow = `<div class="wbody" style="margin-bottom:12px;">
        ${proofEntry ? `<img class="thumb" src="${proofEntry.proof}" data-role="thumb" data-src="${proofEntry.proof}">` : `<div class="thumb-placeholder">no proof</div>`}
        <label class="file-label">${proofEntry ? 'Replace this week’s proof' : 'Upload proof for this week'}<input type="file" accept="image/*" data-week="${weekIndex}" data-role="proof-input"></label>
        ${proofEntry ? `<button class="btn btn-sm btn-danger" data-week="${weekIndex}" data-role="remove-proof">Remove</button>` : ''}
        ${weekTotal && !proofEntry ? `<span class="tag tag-upcoming">Remember to add proof before the week locks</span>` : ''}
      </div>`;
    } else if(wStatus === 'locked'){
      proofRow = `<div class="wbody" style="margin-bottom:12px;">
        ${proofEntry ? `<img class="thumb" src="${proofEntry.proof}" data-role="thumb" data-src="${proofEntry.proof}">` : `<div class="thumb-placeholder">no proof</div>`}
        <span class="steps-readout">Week total: ${weekTotal.toLocaleString()} steps</span>
      </div>`;
    }

    let dayRows = '';
    if(wStatus === 'editable' || wStatus === 'locked'){
      dayRows = '<div class="day-list">';
      for(let d=0; d<7; d++){
        const i = weekIndex*7 + d;
        const date = this.addDays(cfg.startDate, i);
        const dayStatus = this.getDayStatus(i);
        dayRows += this.renderDayRow(date, dayStatus);
      }
      dayRows += '</div>';
    } else {
      dayRows = `<span class="empty" style="padding:0;">Opens once Week ${weekIndex} finishes.</span>`;
    }

    return `<div class="week-card ${wStatus==='locked'?'locked':''}">
      <div class="wtop"${isLocked ? ` data-role="toggle-week-expand" data-week="${weekIndex}" style="cursor:pointer;"` : ''}><div><span class="wname">Week ${weekIndex+1}</span>${dateRange?`<span class="wdates">${dateRange}</span>`:''}</div><div style="display:flex;align-items:center;gap:8px;">${weekTotal?`<span class="steps-readout">${weekTotal.toLocaleString()} steps</span>`:''}${tag}${isLocked ? '<span style="font-size:11px;color:var(--ink-soft);">▲ Collapse</span>' : ''}</div></div>
      ${proofRow}
      ${dayRows}
    </div>`;
  },

  renderDayRow(date, dayStatus){
    const md = this.formatDate(date);
    const d = new Date(date + 'T00:00:00Z');
    const dow = d.toLocaleDateString('en-US', { weekday:'short', timeZone:'UTC' });
    const entry = this.state.mySteps.days[date];
    const draftSteps = this.state.draftSteps[date];
    const editable = dayStatus === 'editable' || dayStatus === 'editable-today';
    // Once a day has a saved entry, show it as plain text instead of
    // leaving the input open — editDay()'s pencil button switches it back
    // into edit mode on demand. A day with no entry yet always opens
    // straight into the input, same as before.
    const isEditing = !entry || this.state.editingDays[date];

    let body = '';
    if(editable && isEditing){
      const val = draftSteps !== undefined ? draftSteps : (entry ? entry.steps : '');
      body = `
        <input class="steps-input" type="number" min="0" max="${DAILY_STEP_CAP}" placeholder="Steps" value="${val}" data-date="${date}" data-role="steps-input">
        <button class="btn btn-primary btn-sm" data-date="${date}" data-role="save-day">Save</button>
      `;
    } else if(editable){
      body = `
        <span class="tag tag-awarded">${entry.steps.toLocaleString()} steps</span>
        <button class="btn btn-sm" data-date="${date}" data-role="edit-day">✏️ Edit</button>
      `;
    } else if(dayStatus === 'locked'){
      body = entry ? `<span class="steps-readout">${entry.steps.toLocaleString()} steps</span>` : `<span class="empty" style="padding:0;">No entry</span>`;
    } else {
      body = `<span class="tag tag-upcoming">Not yet</span>`;
    }

    return `<div class="day-row ${dayStatus==='locked'?'locked':''}">
      <div class="day-date"><div class="dow">${dow}</div><div class="num">${md}</div></div>
      <div class="day-body">${body}</div>
    </div>`;
  },

  // Shared between the individual list (renderTrail) and a team's own list
  // (renderTeamRoster) — targetId is the uid/teamId whose award & submission
  // status this card should reflect, or null if they don't have one yet
  // (joinPrompt is shown instead of the normal status tag in that case).
  renderBonusCard(b, targetId, joinPrompt){
    const awarded = targetId ? b.completed.includes(targetId) : false;
    const submission = targetId && b.submissions ? b.submissions[targetId] : null;
    const deadlinePassed = b.scope === 'week' && Number.isInteger(b.weekIndex) && this.isPastWeekDeadline(b.weekIndex);
    let statusTag;
    if(joinPrompt){
      statusTag = `<span class="tag tag-upcoming">${joinPrompt}</span>`;
    } else if(awarded){
      statusTag = `<span class="tag tag-awarded">Awarded</span>`;
    } else if(b.requirePhoto && submission){
      statusTag = `<span class="tag tag-pending">Submitted — pending review</span>`;
    } else {
      statusTag = `<span class="tag tag-pending">${b.requirePhoto ? 'Not yet submitted' : 'Not yet awarded'}</span>`;
    }
    const scopeLabel = b.scope === 'week' && Number.isInteger(b.weekIndex) ? `<span class="type-pill">Week ${b.weekIndex+1}</span>` : '';
    // Editing (uploading/replacing) is only allowed before the week's
    // deadline and before it's been awarded — enforced here in the UI the
    // same way team-roster editing is only ever enforced by app convention
    // (see firestore.rules' comment on bonus/{bonusId}), not by a Firestore
    // rule, since there's no backend to hold a stricter server-side check.
    const canEdit = !awarded && !deadlinePassed;
    const myProof = targetId ? this.state.myBonusProofs[b.id] : null;
    const thumbHtml = myProof ? `<img class="thumb" src="${myProof.proof}" data-role="thumb" data-src="${myProof.proof}">` : '';
    let proofSection = '';
    if(!joinPrompt && b.requirePhoto && targetId){
      if(canEdit){
        proofSection = `<div class="wbody" style="margin-top:8px;">
          ${thumbHtml}
          <label class="file-label">${submission ? 'Replace your proof photo' : 'Upload proof photo'}<input type="file" accept="image/*" data-bonus="${b.id}" data-role="bonus-proof-input"></label>
          ${submission ? `<button class="btn btn-sm btn-danger" data-bonus="${b.id}" data-role="remove-bonus-proof">Remove</button>` : ''}
        </div>`;
      } else if(submission){
        proofSection = `<div class="wbody" style="margin-top:8px;">
          ${thumbHtml}
          ${!awarded ? `<span class="tag tag-locked">Deadline passed — can no longer be changed</span>` : ''}
        </div>`;
      } else if(deadlinePassed){
        proofSection = `<div class="wbody" style="margin-top:8px;"><span class="tag tag-locked">Deadline passed</span></div>`;
      }
    }
    return `<div class="challenge-card"><div class="ctop">
      <div><span class="ctitle">${b.title}</span><span class="type-pill">${b.type==='team'?'Team':'Individual'}</span>${scopeLabel}${b.description ? `<div class="cdesc">${b.description}</div>` : ''}${b.reminder ? `<div style="margin-top:4px;font-size:12px;color:#7A5A11;background:var(--amber-tint);padding:3px 8px;border-radius:6px;display:inline-block;">🔔 ${b.reminder}</div>` : ''}</div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <span class="points-pill">${b.points} steps</span>
        ${statusTag}
      </div>
    </div>${proofSection}</div>`;
  },

  // ---------- My Team ----------
  renderMyTeam(){
    const team = this.getMyTeam();
    if(!team){
      return this.renderTeamBrowser();
    }
    return this.renderTeamRoster(team);
  },
  // Shown when someone has no team — whether they've never been assigned
  // one, a roster sync unassigned them (their profile/history are kept, not
  // deleted, so they land here instead of being locked out), or a captain
  // removed them. Lets them join an existing team themselves rather than
  // wait on an admin; doesn't let them create a new team (that stays
  // admin/roster-sync-only, so team names/rosters stay authoritative).
  renderTeamBrowser(){
    const isAdminSelf = (this.state.users[this.state.identity.uid] || {}).role === 'admin';
    if(!this.isPrestart() && !isAdminSelf){
      return `<div class="panel"><div class="empty">You're not on a team, and the challenge has already started — ask your admin to sort this out.</div></div>`;
    }
    const MAX_TEAM_SIZE = 5;
    const teams = Object.values(this.state.teams).sort((a,b) => a.name.localeCompare(b.name));
    let html = `<div class="panel"><div class="empty">You're not on a team right now. Join one below, or ask your admin to add you to a specific one.</div></div>`;
    if(!teams.length){
      html += `<div class="panel"><div class="empty">No teams exist yet.</div></div>`;
      return html;
    }
    html += `<div class="panel"><h3>Available teams</h3>`;
    teams.forEach(t => {
      const size = (t.members || []).length;
      const full = size >= MAX_TEAM_SIZE;
      html += `<div class="member-row">
        <div>${t.name} <span style="color:var(--ink-soft);font-size:12px;">(${size}/${MAX_TEAM_SIZE})</span></div>
        <button class="btn btn-sm" data-role="join-team" data-teamid="${t.id}" ${full ? 'disabled' : ''}>${full ? 'Full' : 'Join'}</button>
      </div>`;
    });
    html += `</div>`;
    return html;
  },

  // One race block per week that's actually started, newest first (Week 3,
  // then Week 2, then Week 1) — a week that hasn't started yet is skipped
  // entirely (no title, nothing), not just collapsed, since there's nothing
  // to race yet. The current week's race stays open; a finished week's
  // collapses to a one-line summary you can expand back out, the same
  // pattern renderWeekCard() uses for a person's own past weeks.
  renderTeamRaceHistory(team){
    const cfg = this.state.config;
    if(this.isPrestart()) return '';
    let html = '';
    for(let w = cfg.weeks - 1; w >= 0; w--){
      const wStatus = this.getWeekStatus(w);
      if(wStatus === 'future' || wStatus === 'not-started') continue;
      html += this.renderTeamWeekRace(team, w, wStatus);
    }
    return html;
  },
  renderTeamWeekRace(team, weekIdx, wStatus){
    const raceEntries = team.members.map(m => {
      const u = this.state.users[m];
      return { name: u ? u.name : m, value: this.userWeekTotal(m, weekIdx) };
    });
    const locked = wStatus === 'locked';
    if(locked && !this.state.raceExpandedWeeks[weekIdx]){
      const winner = raceEntries.reduce((best, e) => (!best || e.value > best.value) ? e : best, null);
      return `<div class="panel locked-week" data-role="toggle-race-expand" data-week="${weekIdx}">
        <div class="locked-week-label">Week ${weekIdx+1} race${winner && winner.value ? `<span class="locked-week-total"> — ${winner.name} led with ${winner.value.toLocaleString()} steps</span>` : ''}</div>
        <span style="font-size:11px;color:var(--ink-soft);">▼ Expand</span>
      </div>`;
    }
    return `<div class="panel">
      <h3${locked ? ` data-role="toggle-race-expand" data-week="${weekIdx}" style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;"` : ''}>
        <span>Week ${weekIdx+1} race</span>${locked ? `<span style="font-size:11px;color:var(--ink-soft);font-weight:400;">▲ Collapse</span>` : ''}
      </h3>
      <div class="race-row race-axis-row">
        <div class="race-name"></div>
        <div class="race-axis"><span>Start</span><span>Finish</span></div>
      </div>
      ${this.renderRaceTrack(raceEntries, 'assets/otters/otter-lion.png', { unit:'steps', locked })}
    </div>`;
  },

  renderTeamRoster(team){
    const prestart = this.isPrestart();
    const isCaptain = team.captainUid === this.state.identity.uid;
    const teamTotal = team.members.reduce((s,m)=> s + this.userTotal(m), 0);
    const funHtml = this.renderFunStats(this.getFunFacts('team', teamTotal, team.id));

    const raceHtml = this.renderTeamRaceHistory(team);

    const membersHtml = team.members.map(m => {
      const u = this.state.users[m];
      const isCap = m === team.captainUid;
      return `<div class="member-row">
        <div>${u ? u.name : m}${isCap ? '<span class="captain-tag">Captain</span>' : ''}</div>
        ${prestart && isCaptain && !isCap ? `<button class="btn btn-sm btn-danger" data-role="remove-member" data-teamid="${team.id}" data-uid="${m}">Remove</button>` : ''}
      </div>`;
    }).join('');

    const bonusList = Object.values(this.state.bonus).filter(b => b.type==='team' && b.active !== false && this.isBonusVisibleNow(b));
    let bonusHtml = '';
    if(bonusList.length){
      bonusHtml = `<div class="panel"><h3>Bonus challenges for your team</h3>` + bonusList.map(b => this.renderBonusCard(b, team.id, null)).join('') + `</div>`;
    }

    return `
      <div class="panel">
        <h3><img class="header-logo" src="assets/otters/otter-sg.png" alt="">${team.name} <span class="tag tag-open" style="margin-left:8px;">${team.members.length}/${TEAM_SIZE_LIMIT}</span></h3>
        ${membersHtml}
        <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div style="font-size:13px;color:var(--ink-soft);">Team total: ${teamTotal.toLocaleString()} steps</div>
          ${prestart ? `<button class="btn btn-sm" data-role="leave-team">Leave team</button>` : ''}
        </div>
      </div>
      ${raceHtml}
      ${funHtml}
      ${bonusHtml}
    `;
  },

  // ---------- Leaderboard ----------
  // One dedicated lane per entry (like real swim lanes) so otters never
  // overlap even when scores are close — each otter's position along its
  // lane is relative to the group's current leader, and moves further right
  // as more steps come in, since render() re-derives this from live totals.
  // opts.max overrides the leader used for normalization (e.g. the overall
  // #1, when rendering a subset that excludes the actual leader); opts.unit,
  // when given, shows each entry's raw total under its name. opts.locked
  // === false means this race is still in progress (a team's current week):
  // the leader is capped short of the finish line — otherwise, since `max`
  // defaults to the leader's own value, they'd always compute to exactly
  // 100% and look "arrived" from the very first step of the week. Once the
  // week is actually over (opts.locked left undefined/true, e.g. the
  // leaderboard's overall ranking, or a team's past week), the true leader
  // reaches the finish line for real.
  renderRaceTrack(entries, otterSrc, opts){
    opts = opts || {};
    if(!entries.length) return `<div class="empty">No one in this race yet.</div>`;
    const max = opts.max || Math.max(1, ...entries.map(e=>e.value));
    const capPct = opts.locked === false ? 90 : 100;
    return entries.map((e, i) => {
      const pct = Math.min(capPct, Math.max(2, (e.value/max)*100));
      const delay = (i % 5) * 0.11;
      const arrived = capPct === 100 && pct >= 100;
      return `<div class="race-row">
        <div class="race-name">${e.name}${opts.unit ? `<div class="race-value">${e.value.toLocaleString()} ${opts.unit}</div>` : ''}</div>
        <div class="race-lane-track">
          <img class="race-lane-otter" src="${otterSrc}" alt="" style="left:${pct.toFixed(1)}%;animation-delay:${delay.toFixed(2)}s;${arrived ? 'animation-play-state:paused;' : ''}">
          <div class="race-lane-finish"></div>
        </div>
      </div>`;
    }).join('');
  },

  // name/rank/value rows, dense/competition ranked (a tie shares the same
  // rank number; the next distinct value's rank skips ahead by the size of
  // the tie — 1, 1, 3, not 1, 1, 2). myId's row gets a highlight.
  renderCollapsedRows(entries, unit, myId){
    const rows = entries.map(e => `<div class="collapsed-row${e.id===myId?' mine':''}">
      <div class="collapsed-rank">${e.rank}</div>
      <div class="collapsed-name">${e.name}</div>
      <div class="collapsed-value">${e.value.toLocaleString()} ${unit}</div>
    </div>`).join('');
    return `<div class="collapsed-list">${rows}</div>`;
  },
  // Top 3 on a podium, myId's block ringed/badged if they're on it. Below
  // that: if the viewer IS on the podium (or has no entry to look for —
  // e.g. not on a team yet), show everyone else's row right away. If NOT,
  // show just the viewer's own row plus a toggle to reveal everyone else,
  // so they can always find themselves without necessarily seeing the
  // whole roster.
  renderLeaderboardBoard(entries, unit, myId, otterSrc){
    if(!entries.length) return `<div class="empty">No one to rank yet.</div>`;
    let rank = 0;
    const ranked = entries.map((e, i) => {
      if(i === 0 || e.value !== entries[i-1].value) rank = i + 1;
      return { ...e, rank };
    });
    const top3 = ranked.slice(0,3);
    const rest = ranked.slice(3);
    const myEntry = myId != null ? ranked.find(e => e.id === myId) : null;
    const myInTop3 = !!myEntry && top3.some(e => e.id === myId);

    const podiumHtml = `<div class="podium-wrap">${top3.map(e => `
      <div class="podium-block rank-${e.rank}${e.id===myId?' mine':''}">
        <img class="podium-otter" src="${otterSrc}" alt="">
        <div class="podium-rank">${e.rank}</div>
        <div class="podium-name">${e.name}</div>
        <div class="podium-value">${e.value.toLocaleString()} ${unit}</div>
        ${e.id===myId ? `<span class="tag tag-awarded" style="margin-top:4px;">You</span>` : ''}
      </div>`).join('')}</div>
      <div class="podium-base-bar"></div>`;

    if(!rest.length) return podiumHtml;

    // Collapsed by default no matter who's on the podium: just the viewer's
    // own row (if they have one outside the top 3 — nothing extra to show
    // if they're already on the podium, or have no entry at all). Expanding
    // always reveals everyone, with the viewer's row still highlighted.
    let restHtml;
    if(this.state.lbExpanded){
      restHtml = this.renderCollapsedRows(rest, unit, myId);
    } else if(myEntry && !myInTop3){
      restHtml = this.renderCollapsedRows([myEntry], unit, myId);
    } else {
      restHtml = '';
    }
    const toggleLabel = this.state.lbExpanded ? 'Hide full list' : 'Show full list';
    return podiumHtml + restHtml + `<button class="expand-toggle" data-role="toggle-lb-expand">${toggleLabel}</button>`;
  },

  renderLeaderboard(){
    const cfg = this.state.config;
    const st = this.getChallengeStatus();
    if(this.state.lbTab === null){
      this.state.lbTab = st.started ? `week-${Math.min(st.weekIndex, cfg.weeks-1)}` : 'overall';
    }
    // Only a week that's actually started gets a tab — Week 2 stays hidden
    // until Week 2 is current, so there's nothing to peek at ahead of time.
    // Once the challenge ends, st.weekIndex is pinned to the last week, so
    // every week shows.
    const lastVisibleWeek = st.started ? st.weekIndex : -1;
    let subtabs = '';
    for(let w=0; w<=lastVisibleWeek; w++) subtabs += `<div class="subtab ${this.state.lbTab==='week-'+w?'active':''}" data-lb="week-${w}">Week ${w+1}</div>`;
    subtabs += `<div class="subtab ${this.state.lbTab==='overall'?'active':''}" data-lb="overall">Overall</div>`;

    const sel = this.state.lbTab === 'overall' ? 'overall' : Number(this.state.lbTab.split('-')[1]);
    // Every step counts as a point, and so does an awarded bonus challenge's
    // points — combined into one total on every tab (a week's tab only
    // picks up bonuses scoped to that same week; Overall picks up all of
    // them — see individualBonusPoints()/teamBonusPoints()).
    const unit = 'steps';

    const teams = Object.values(this.state.teams).map(t => {
      let value = t.members.reduce((s,m)=> s + this.userWeekTotal(m, sel), 0);
      value += this.teamBonusPoints(t.id, sel);
      return { id: t.id, name: t.name, value };
    }).sort((a,b)=>b.value-a.value);

    const individuals = Object.values(this.state.users).map(u => {
      let value = this.userWeekTotal(u.uid, sel);
      value += this.individualBonusPoints(u.uid, sel);
      return { id: u.uid, name: u.name, value };
    }).sort((a,b)=>b.value-a.value);

    const topRow = `<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;">
      <div class="lb-mode-toggle" style="margin-bottom:0;">
        <button class="lb-mode-btn ${this.state.lbMode==='team'?'active':''}" data-role="lb-mode" data-mode="team">Teams</button>
        <button class="lb-mode-btn ${this.state.lbMode==='individual'?'active':''}" data-role="lb-mode" data-mode="individual">Individuals</button>
      </div>
      <button class="btn btn-sm" id="btn-refresh-leaderboard" ${this.state.lbRefreshing ? 'disabled' : ''}>${this.state.lbRefreshing ? 'Refreshing…' : '↻ Refresh'}</button>
    </div>`;

    const myTeam = this.getMyTeam();
    const board = this.state.lbMode === 'team'
      ? this.renderLeaderboardBoard(teams, unit, myTeam ? myTeam.id : null, 'assets/otters/otter-sg.png')
      : this.renderLeaderboardBoard(individuals, unit, this.state.identity.uid, 'assets/otters/otter-lion.png');

    return `
      <div class="subtabs">${subtabs}</div>
      <div class="panel race-panel">
        ${topRow}
        <div style="margin-top:14px;">${board}</div>
      </div>
    `;
  },

  // ---------- Admin ----------
  renderAdmin(){
    const cfg = this.state.config;
    let html = `
      <div class="panel">
        <h3>Challenge settings</h3>
        <div class="config-row">
          <div class="field" style="margin-bottom:0;"><label>Start date (Singapore time)</label><input type="date" id="in-startdate" value="${cfg.startDate || ''}"></div>
          <button class="btn btn-primary" id="btn-save-startdate">Save date</button>
        </div>
        <div class="config-row" style="margin-top:14px;">
          <div class="field" style="margin-bottom:0;"><label>Maximum steps per day (optional)</label><input type="number" id="in-stepslimit" min="1" placeholder="No limit" value="${cfg.stepsLimit || ''}"></div>
          <button class="btn btn-primary" id="btn-save-limit">Save limit</button>
        </div>
        <div style="margin-top:16px;"><button class="btn btn-danger btn-sm" id="btn-reset">Reset challenge data</button></div>
      </div>
    `;

    html += this.renderAdminBonus();
    html += this.renderAdminParticipantTools();

    if(!this.state.allStepsLoaded){
      html += `<div class="panel"><div class="loading">Loading participant status…</div></div>`;
      return html;
    }

    const status = this.getChallengeStatus();
    let users = Object.values(this.state.users).map(u => ({ u, issues: this.missingIssues(u) }));
    const teamNameOf = u => u.teamId ? (this.state.teams[u.teamId]?.name || u.teamId) : null;
    users.sort((a,b) => {
      const teamA = teamNameOf(a.u), teamB = teamNameOf(b.u);
      if(teamA !== teamB){
        if(teamA === null) return 1;
        if(teamB === null) return -1;
        return teamA.localeCompare(teamB);
      }
      return b.issues.length - a.issues.length || a.u.name.localeCompare(b.u.name);
    });
    const missingCount = users.filter(({issues}) => issues.length > 0).length;
    if(this.state.participantMissingOnly) users = users.filter(({issues}) => issues.length > 0);

    const prestart = this.isPrestart();
    const hasStart = !!cfg.startDate;
    html += `<div class="panel"><h3>Participants (${users.length}) <span style="font-weight:400;font-size:12px;color:var(--ink-soft);">grouped by team — click a team to expand</span></h3>`;
    html += `<div style="margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      <button class="btn btn-sm" id="btn-export-all-data">Export all data (CSV)</button>
      <button class="btn btn-sm" id="btn-random-audit">🎲 Randomly select someone to audit</button>
      ${prestart ? `<button class="btn btn-sm btn-danger" id="btn-clear-all-participants">Clear all participants</button>` : ''}
      ${hasStart ? `<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);"><input type="checkbox" id="in-missing-only" ${this.state.participantMissingOnly?'checked':''}> Show only missing proof (${missingCount})</label>` : ''}
    </div>`;
    if(!hasStart){
      html += `<div class="notice" style="margin-bottom:10px;">Set a start date above to begin tracking weekly status — names, teams, and roles below still work regardless.</div>`;
    }
    const teamOptions = Object.values(this.state.teams).sort((a,b) => a.name.localeCompare(b.name));
    const colCount = 3 + (hasStart ? cfg.weeks+2 : 0) + 2;

    // Grouped by team, collapsed to a one-line count each — same pattern as
    // the proof-photo gallery below — so an admin can jump to one team's
    // roster instead of scrolling a single flat list of everyone.
    const teamGroups = {};
    users.forEach(row => {
      const teamId = row.u.teamId || '__none';
      if(!teamGroups[teamId]) teamGroups[teamId] = [];
      teamGroups[teamId].push(row);
    });
    const teamIds = Object.keys(teamGroups).sort((a,b) => {
      if(a === '__none') return 1;
      if(b === '__none') return -1;
      const nameA = this.state.teams[a] ? this.state.teams[a].name : a;
      const nameB = this.state.teams[b] ? this.state.teams[b].name : b;
      return nameA.localeCompare(nameB);
    });

    html += `<div class="table-wrap"><table class="roster"><thead><tr><th>Name</th><th class="col-email">Email</th><th>Team</th>`;
    if(hasStart){
      for(let w=0; w<cfg.weeks; w++) html += `<th>Week ${w+1}</th>`;
      html += `<th>Total</th><th>Flag</th>`;
    }
    html += `<th>Role</th><th></th></tr></thead><tbody>`;

    teamIds.forEach(teamId => {
      const teamName = teamId === '__none' ? 'No team' : (this.state.teams[teamId] ? this.state.teams[teamId].name : teamId);
      const groupRows = teamGroups[teamId];
      const groupMissing = groupRows.filter(({issues}) => issues.length > 0).length;
      const teamExpanded = this.state.participantMissingOnly || !!this.state.expandedParticipantTeams[teamId];
      html += `<tr class="roster-group-row" data-role="toggle-participant-team" data-team="${teamId}"><td colspan="${colCount}" style="padding:0;border-bottom:none;">
        <div class="locked-week" style="margin:6px 0;">
          <div class="locked-week-label">${teamName}<span class="locked-week-total"> — ${groupRows.length} participant${groupRows.length===1?'':'s'}${groupMissing ? `, ${groupMissing} missing proof` : ''}</span></div>
          <span style="font-size:11px;color:var(--ink-soft);">${teamExpanded ? '▲ Collapse' : '▼ Expand'}</span>
        </div>
      </td></tr>`;
      if(!teamExpanded) return;

      groupRows.forEach(({u, issues}) => {
        const rec = this.state.allSteps[u.uid] || { days:{}, hasProof:{} };
        const total = this.totalStepsOf(rec);
        const teamCell = (prestart || u.role === 'admin')
          ? `<select data-role="assign-team" data-uid="${u.uid}" style="font-size:12px;padding:2px 4px;">
              <option value="">No team</option>
              ${teamOptions.map(t => `<option value="${t.id}" ${u.teamId===t.id?'selected':''}>${t.name} (${(t.members||[]).length}/5)</option>`).join('')}
            </select>`
          : (u.teamId ? (this.state.teams[u.teamId]?.name || u.teamId) : '—');
        html += `<tr data-uid="${u.uid}"><td>${u.name}</td><td class="col-email">${u.email}</td><td>${teamCell}</td>`;
        if(hasStart){
          for(let w=0; w<cfg.weeks; w++){
            const weekTotal = this.totalStepsInRange(rec, w);
            const proof = rec.hasProof && rec.hasProof[w];
            const wStatus = this.getWeekStatus(w);
            let cell;
            const review = rec.verified && rec.verified[w];
            const reviewPill = review ? `<span class="status-pill status-${review.status}" style="padding:2px 8px;font-size:10px;">${REVIEW_STATUS_META[review.status].short}</span>` : '';
            if(!weekTotal){
              cell = wStatus === 'locked' ? '<span style="color:var(--rust);">missing</span>' : (wStatus==='editable' ? 'pending' : '—');
            } else {
              cell = weekTotal.toLocaleString() + (proof ? ' ✓' : ' <span style="color:var(--rust);">⚠ no proof</span>') + (reviewPill ? ' ' + reviewPill : '');
            }
            html += `<td class="week-cell">${cell}</td>`;
          }
          html += `<td>${total.toLocaleString()}</td>`;
          html += `<td>${issues.length ? `<span class="tag tag-flag">⚠ ${issues.length}</span>` : ''}</td>`;
        }
        html += `<td><span class="role-pill ${u.role==='admin'?'admin':''}">${u.role}</span></td>`;
        const expanded = this.state.expandedParticipant === u.uid;
        html += `<td>
          <div class="roster-actions">
            <button class="btn btn-sm" data-role="view-user" data-uid="${u.uid}">${expanded ? 'Hide' : 'View'}</button>
            <button class="btn btn-sm" data-role="toggle-role" data-uid="${u.uid}" data-newrole="${u.role==='admin'?'user':'admin'}">${u.role==='admin'?'Demote':'Promote'}</button>
          </div>
        </td>`;
        html += `</tr>`;
        if(expanded){
          html += `<tr class="detail-row"><td colspan="${colCount}">${this.renderParticipantWeekBlocks(u.uid)}</td></tr>`;
        }
      });
    });
    html += `</tbody></table></div></div>`;

    const teams = Object.values(this.state.teams);
    html += `<div class="panel"><h3>Teams (${teams.length})</h3>`;
    html += teams.length ? teams.map(t => `<div class="team-card">
        <div><div class="tname">${t.name}</div><div class="tmeta">${t.members.length}/${TEAM_SIZE_LIMIT} · captain ${this.state.users[t.captainUid] ? this.state.users[t.captainUid].name : '—'} · ${t.members.map(m=>this.state.users[m]?this.state.users[m].name:m).join(', ')}</div></div>
      </div>`).join('') : `<div class="empty">No teams formed yet.</div>`;
    html += `</div>`;

    html += this.renderAdminAdmins();
    html += this.renderAdminProof();

    return html;
  },

  // Who currently has admin access, plus a search-to-promote tool for
  // granting it and a one-click demote for revoking it (e.g. someone
  // promoted by mistake). Promote/demote both go through the same
  // toggle-role action the Participants table's own Promote/Demote button
  // uses (see setRole()) — this is just a second, more findable place to
  // reach it, focused on admins specifically rather than buried inside a
  // collapsed team group.
  renderAdminAdmins(){
    const allUsers = Object.values(this.state.users);
    const admins = allUsers.filter(u => u.role === 'admin').sort((a,b) => a.name.localeCompare(b.name));
    const nonAdmins = allUsers.filter(u => u.role !== 'admin').sort((a,b) => a.name.localeCompare(b.name));

    let html = `<div class="panel"><h3>Admins (${admins.length})</h3>`;
    html += admins.length
      ? `<div class="table-wrap"><table class="roster"><thead><tr><th>Name</th><th class="col-email">Email</th><th>Team</th><th></th></tr></thead><tbody>`
        + admins.map(u => `<tr><td>${u.name}</td><td class="col-email">${u.email}</td><td>${u.teamId ? (this.state.teams[u.teamId]?.name || u.teamId) : '—'}</td>
            <td><button class="btn btn-sm" data-role="toggle-role" data-uid="${u.uid}" data-newrole="user">Demote</button></td></tr>`).join('')
        + `</tbody></table></div>`
      : `<div class="empty">No admins yet.</div>`;

    html += `<div style="margin-top:14px;">
      <div class="field" style="margin-bottom:8px;max-width:320px;"><label>Promote a participant to admin</label><input type="text" id="in-admin-promote-search" placeholder="Search by name…" autocomplete="off"></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${nonAdmins.map(u => `<div data-role="promote-candidate" data-name="${u.name.toLowerCase()}" style="display:none;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:20px;padding:4px 6px 4px 12px;font-size:12px;">
          <span>${u.name}</span>
          <button class="btn btn-sm" data-role="toggle-role" data-uid="${u.uid}" data-newrole="admin">Promote</button>
        </div>`).join('')}
      </div>
    </div>`;

    const msg = this.state.adminCreateMsg;
    html += `<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line);">
      <h4 style="margin:0 0 8px;font-size:14px;">Create a brand-new admin account</h4>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">For someone who doesn't have a participant account yet. Creates a login with username <code>admin_name</code> (e.g. "Maya" → <code>admin_maya</code>) and a password that's the same as the username.</div>
      ${msg ? `<div class="notice" style="${msg.type==='error' ? 'background:var(--rust-tint);color:var(--rust);' : ''}margin-bottom:8px;">${msg.text}</div>` : ''}
      <div class="form-inline">
        <div class="field" style="margin-bottom:0;flex:1;min-width:160px;"><label>Name</label><input type="text" id="in-new-admin-name" placeholder="Maya"></div>
        <button class="btn btn-primary" id="btn-create-admin">Create admin</button>
      </div>
    </div>`;

    html += `</div>`;
    return html;
  },

  // A person's per-week proof photo + AI check + review buttons, inline in
  // the Participants table (see the "View" button above) rather than a
  // separate popup — so their proof sits right next to their own step
  // counts. Photos come from viewedProofs, lazy-loaded per person by
  // openParticipantDetail() the same way loadAllProofs()/loadProofsFor()
  // already avoid bulk-fetching everyone's photos up front.
  renderParticipantWeekBlocks(uid){
    const rec = this.state.allSteps[uid] || { days:{}, hasProof:{} };
    const proofs = this.state.viewedProofs[uid] || null;
    const cfg = this.state.config;

    let weekBlocks = '';
    for(let w=0; w<cfg.weeks; w++){
      const weekTotal = this.totalStepsInRange(rec, w);
      const proof = proofs ? this.weekProofOf(proofs, w) : null;
      const review = rec.verified && rec.verified[w];
      const reviewStatus = review ? review.status : 'pending';

      let dayRows = '';
      if(cfg.startDate){
        for(let d=0; d<7; d++){
          const date = this.addDays(cfg.startDate, w*7 + d);
          const entry = rec.days[date];
          dayRows += `<tr><td>${this.formatDate(date)}</td><td>${entry ? entry.steps.toLocaleString() : '—'}</td></tr>`;
        }
      }

      weekBlocks += `<div class="week-card" style="margin-top:12px;">
        <div class="wtop">
          <div><span class="wname">Week ${w+1}</span></div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${weekTotal?`<span class="steps-readout">${weekTotal.toLocaleString()} steps</span>`:''}
            <span class="status-pill status-${reviewStatus}">${REVIEW_STATUS_META[reviewStatus].label}</span>
          </div>
        </div>
        <div class="wbody" style="margin-bottom:6px;">
          ${proofs === null ? `<div class="thumb-placeholder">loading…</div>` : (proof ? `<img class="thumb" src="${proof.proof}" data-role="thumb-review" data-uid="${uid}" data-week="${w}" data-src="${proof.proof}" style="cursor:zoom-in;">` : `<div class="thumb-placeholder">no proof</div>`)}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
          ${['verified','needs_review','rejected'].map(s => `<button class="btn btn-sm" data-role="set-review" data-uid="${uid}" data-week="${w}" data-status="${s}"
            style="${reviewStatus===s ? `background:${REVIEW_STATUS_META[s].bg};border-color:${REVIEW_STATUS_META[s].bg};color:${REVIEW_STATUS_META[s].fg};` : ''}">${REVIEW_STATUS_META[s].short}</button>`).join('')}
          ${review ? `<button class="btn btn-sm" data-role="set-review" data-uid="${uid}" data-week="${w}" data-status="">Clear</button>` : ''}
        </div>
        ${dayRows ? `<table><thead><tr><th>Day</th><th>Steps</th></tr></thead><tbody>${dayRows}</tbody></table>` : ''}
      </div>`;
    }
    return weekBlocks;
  },

  // Photos live in their own `proofs` collection, fetched in bulk only when
  // an admin deliberately asks to browse or export them — not automatically
  // alongside the rest of the Admin tab, which would otherwise mean every
  // admin visit downloads every participant's photos regardless of need.
  renderAdminProof(){
    if(!this.state.allProofsLoaded){
      return `<div class="panel"><h3>Proof photos</h3>
        <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px;">Not loaded yet — these are fetched separately from the rest of this tab so a routine visit doesn't download every participant's photos.</div>
        <button class="btn btn-sm" id="btn-load-proofs" ${this.state.allProofsLoading ? 'disabled' : ''}>${this.state.allProofsLoading ? 'Loading…' : 'Load proof photos'}</button>
      </div>`;
    }
    const rows = [];
    Object.values(this.state.users).forEach(u => {
      const rec = this.state.allProofs[u.uid];
      if(!rec) return;
      for(let w=0; w<this.state.config.weeks; w++){
        const proof = this.weekProofOf(rec, w);
        if(proof) rows.push({ u, w, proof });
      }
    });
    let html = `<div class="panel"><h3>Proof photos (${rows.length})</h3>`;
    html += `<div style="margin-bottom:12px;"><button class="btn btn-sm" id="btn-export-proof">Export all proof (ZIP)</button></div>`;
    if(!rows.length){
      html += `<div class="empty">No proof photos uploaded yet.</div></div>`;
      return html;
    }
    // Grouped by team, collapsed to a one-line count each — same pattern as
    // a locked week — so an admin can jump to one team's photos instead of
    // scrolling a single flat grid of everyone's.
    const groups = {};
    rows.forEach(row => {
      const teamId = row.u.teamId || '__none';
      if(!groups[teamId]) groups[teamId] = [];
      groups[teamId].push(row);
    });
    const teamIds = Object.keys(groups).sort((a,b) => {
      if(a === '__none') return 1;
      if(b === '__none') return -1;
      const nameA = this.state.teams[a] ? this.state.teams[a].name : a;
      const nameB = this.state.teams[b] ? this.state.teams[b].name : b;
      return nameA.localeCompare(nameB);
    });
    teamIds.forEach(teamId => {
      const teamName = teamId === '__none' ? 'No team' : (this.state.teams[teamId] ? this.state.teams[teamId].name : teamId);
      const groupRows = groups[teamId];
      const expanded = !!this.state.expandedProofTeams[teamId];
      html += `<div class="locked-week" data-role="toggle-proof-team" data-team="${teamId}">
        <div class="locked-week-label">${teamName}<span class="locked-week-total"> — ${groupRows.length} photo${groupRows.length===1?'':'s'}</span></div>
        <span style="font-size:11px;color:var(--ink-soft);">${expanded ? '▲ Collapse' : '▼ Expand'}</span>
      </div>`;
      if(expanded){
        html += `<div style="display:flex;flex-wrap:wrap;gap:12px;margin:-4px 0 14px;">`;
        groupRows.forEach(({u,w,proof}) => {
          html += `<div style="width:100px;text-align:center;">
            <img class="thumb" style="width:100px;height:100px;" src="${proof.proof}" data-role="thumb" data-src="${proof.proof}">
            <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${u.name}</div>
            <div style="font-size:10px;color:var(--ink-soft);">Week ${w+1}</div>
          </div>`;
        });
        html += `</div>`;
      }
    });
    html += `</div>`;
    return html;
  },

  renderAdminParticipantTools(){
    if(!this.isPrestart()){
      return `<div class="panel"><h3>Roster tools</h3><div class="empty">The challenge has started — team details (rosters, teams, who's on what) are locked for the rest of the event. Individual accounts, roles, and reviews can still be managed below.</div></div>`;
    }
    const f = this.state.participantForm;
    const msg = this.state.participantActionMsg;
    let html = '';

    const orphanedCount = Object.keys(this.orphanedTeamIds()).length;
    if(orphanedCount){
      html += `<div class="panel">
        <h3>⚠ Recovery available</h3>
        <div style="font-size:13px;">${orphanedCount} participant${orphanedCount===1?'':'s'} ${orphanedCount===1?'has a':'have a'} team assignment pointing at a team that no longer exists (e.g. a team got deleted directly in the Firebase Console). You can rebuild ${orphanedCount===1?'it':'them'} from the surviving profiles.</div>
        <div style="font-size:12px;color:var(--ink-soft);margin:6px 0 10px;">Team names will be a best guess and captains picked arbitrarily — check both afterward.</div>
        <button class="btn btn-primary btn-sm" id="btn-rebuild-teams">Rebuild ${orphanedCount} team${orphanedCount===1?'':'s'} from profiles</button>
      </div>`;
    }

    html += `<div class="panel">
      <h3>Add a participant</h3>
      ${msg ? `<div class="notice" style="${msg.type==='error' ? 'background:var(--rust-tint);color:var(--rust);' : ''}">${msg.text}</div>` : ''}
      <div class="form-inline">
        <div class="field" style="margin-bottom:0;flex:1;min-width:160px;"><label>Team name (optional)</label><input type="text" id="in-part-team" value="${f.teamName}" placeholder="Trail Blazers"></div>
        <div class="field" style="margin-bottom:0;flex:1;min-width:160px;"><label>Person name</label><input type="text" id="in-part-name" value="${f.personName}" placeholder="Frank Yeo"></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:8px;"><input type="checkbox" id="in-part-captain" ${f.captain?'checked':''}> Make captain</label>
        <button class="btn btn-primary" id="btn-add-participant">Add</button>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Creates a new team if it doesn't exist yet (up to 5 people per team). Leave team name blank to create the account with no team — assign one afterward from the "Team" dropdown in the Participants table below. Their username and password (the same as the username) are shown here once added.</div>
    </div>`;

    html += `<div class="panel">
      <h3>Key in the team roster</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">
        Columns, in this exact order, no header needed: <code>Team Name, Captain, Member 2, Member 3, Member 4, Member 5</code> (leave later columns blank for smaller teams). <a href="scripts/roster.example.csv" target="_blank" rel="noopener">See an example</a>.
        <br><strong>Every submission fully replaces the current roster.</strong> There's no personal data to lose before the challenge starts, so re-keying wipes every existing participant and regenerates fresh accounts (and passwords) from exactly what's in this list — nothing is merged or carried over.
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Upload a CSV file</label><input type="file" accept=".csv,text/csv" id="in-roster-file" ${this.state.rosterImportBusy ? 'disabled' : ''}></div>
      <div class="field" style="margin-bottom:8px;"><label>…or paste the list here instead</label><textarea id="in-roster-paste" rows="5" placeholder="Trail Blazers, Alice Tan, Bob Lee, , ,&#10;Wave Riders, Chris Ong, Dana Lim, Eve Koh, ," ${this.state.rosterImportBusy ? 'disabled' : ''}></textarea></div>
      <button class="btn btn-primary" id="btn-sync-roster" ${this.state.rosterImportBusy ? 'disabled' : ''}>Regenerate roster</button>
      ${this.state.rosterImportBusy ? `<div class="loading">Working…</div>` : ''}
    `;
    const result = this.state.rosterImportResult;
    if(result && result.error){
      html += `<div class="notice" style="background:var(--rust-tint);color:var(--rust);margin-top:10px;">${result.error}</div>`;
    } else if(result){
      html += `<div style="margin-top:10px;font-size:13px;">
        <div>${result.credentials.length} account(s) generated.${result.skipped.length ? ` ${result.skipped.length} row(s) skipped.` : ''}</div>
        ${result.skipped.length ? `<div style="margin-top:6px;"><strong>Skipped rows:</strong><ul style="margin:4px 0;padding-left:18px;color:var(--rust);font-size:12px;">${result.skipped.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : ''}
        ${result.credentials.length ? `<button class="btn btn-sm" id="btn-download-roster-creds" style="margin-top:6px;">Download usernames &amp; passwords (CSV)</button>` : ''}
      </div>`;
    }
    html += `</div>`;
    return html;
  },

  renderAdminBonus(){

      <h3>Bonus challenges</h3>
      <div class="form-inline">
        <div class="field" style="margin-bottom:0;flex:2;min-width:160px;"><label>Title</label><input type="text" id="in-bonus-title" value="${f.title}" placeholder="Weekend hike"></div>

        <div class="field" style="margin-bottom:0;flex:3;min-width:180px;"><label>Reminder (optional)</label><input type="text" id="in-bonus-reminder" value="${f.reminder}" placeholder="Don't forget to bring your hiking shoes!"></div>

            <option value="overall" ${scopeVal==='overall'?'selected':''}>Whole challenge</option>
            ${Array.from({length: cfg.weeks}, (_,w) => `<option value="week-${w}" ${scopeVal==='week-'+w?'selected':''}>Week ${w+1}</option>`).join('')}

        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:8px;"><input type="checkbox" id="in-bonus-photo" ${f.requirePhoto?'checked':''}> Require photo proof</label>

      <div class="lb-mode-toggle">
        <button class="lb-mode-btn ${this.state.bonusManageFilter==='all'?'active':''}" data-role="bonus-manage-filter" data-filter="all">All</button>
        <button class="lb-mode-btn ${this.state.bonusManageFilter==='individual'?'active':''}" data-role="bonus-manage-filter" data-filter="individual">Individual</button>
        <button class="lb-mode-btn ${this.state.bonusManageFilter==='team'?'active':''}" data-role="bonus-manage-filter" data-filter="team">Team</button>
      </div>`;
    const filteredList = list.filter(b => this.state.bonusManageFilter === 'all' || b.type === this.state.bonusManageFilter);
    if(!filteredList.length){
      html += `<div class="empty">No ${this.state.bonusManageFilter} challenges yet.</div></div>`;
      return html;
    }
    filteredList.forEach(b => {
      const targets = b.type === 'individual'
        ? Object.values(this.state.users).map(u => ({ id:u.uid, name:u.name }))
        : Object.values(this.state.teams).map(t => ({ id:t.id, name:t.name }));
      const scopeLabel = b.scope === 'week' && Number.isInteger(b.weekIndex) ? `<span class="type-pill">Week ${b.weekIndex+1}</span>` : '';
      html += `<div class="challenge-card">
        <div class="ctop">
          <div><span class="ctitle">${b.title}</span><span class="type-pill">${b.type==='individual'?'Individual':'Team'}</span>${scopeLabel}${b.requirePhoto?'<span class="type-pill">Photo required</span>':''}${b.active===false?'<span class="type-pill">Disabled</span>':''}${b.description?`<div class="cdesc">${b.description}</div>`:''}${b.reminder?`<div style="margin-top:4px;font-size:12px;color:#7A5A11;background:var(--amber-tint);padding:3px 8px;border-radius:6px;display:inline-block;">🔔 ${b.reminder}</div>`:''}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="points-pill">${b.points} steps</span>
            <button class="btn btn-sm" data-role="toggle-bonus-active" data-id="${b.id}">${b.active===false?'Enable':'Disable'}</button>
            <button class="btn btn-sm btn-danger" data-role="delete-bonus" data-id="${b.id}">Delete</button>
          </div>
        </div>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:10px;">
          ${targets.length ? `<div class="field" style="margin-bottom:0;max-width:280px;"><input type="text" data-role="bonus-filter" placeholder="Search by ${b.type==='individual'?'individual name':'team name'}…"></div>` : ''}
          <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);"><input type="checkbox" data-role="bonus-awarded-filter"> Show only awarded</label>
        </div>
        <div class="award-grid">
          ${targets.length ? targets.map(t => `<div class="award-chip ${b.completed.includes(t.id)?'awarded':''}" data-role="toggle-award" data-id="${b.id}" data-target="${t.id}" data-name="${t.name.toLowerCase()}">${b.completed.includes(t.id)?'✓ ':''}${t.name}</div>`).join('') : `<span class="empty" style="padding:0;">No ${b.type==='individual'?'participants':'teams'} yet.</span>`}
        </div>
        ${b.requirePhoto ? this.renderBonusSubmissions(b, targets) : ''}
      </div>`;
    });
    html += `</div>`;
    return html;
  },

  // Photo-proof submissions for one bonus challenge — targets who've
  // submitted, each with a lazy-loaded thumbnail (same on-demand fetch
  // pattern as renderAdminProof()), an AI check, and the same
  // verified/needs_review/rejected review buttons the weekly steps use.
  renderBonusSubmissions(b, targets){
    const submissions = b.submissions || {};
    const submittedTargets = targets.filter(t => submissions[t.id]);
    const proofsLoaded = !!this.state.viewedBonusProofs[b.id];
    let html = `<div style="margin-top:14px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <strong style="font-size:13px;">Submitted proof (${submittedTargets.length})</strong>
        ${!proofsLoaded ? `<button class="btn btn-sm" data-role="load-bonus-proofs" data-id="${b.id}">Load proof photos</button>` : ''}
      </div>`;
    if(proofsLoaded){
      if(!submittedTargets.length){
        html += `<div class="empty" style="padding:0;">No submissions yet.</div>`;
      } else {
        const proofs = this.state.viewedBonusProofs[b.id] || {};
        const reviews = b.reviews || {};
        submittedTargets.forEach(t => {
          const review = reviews[t.id];
          const proof = proofs[t.id];
          const reviewStatus = review ? review.status : 'pending';
          html += `<div class="week-card" style="margin-bottom:10px;">
            <div class="wtop"><div><span class="wname">${t.name}</span></div><span class="status-pill status-${reviewStatus}">${REVIEW_STATUS_META[reviewStatus].label}</span></div>
            <div class="wbody" style="margin-bottom:6px;">
              ${proof ? `<img class="thumb" src="${proof.proof}" data-role="thumb" data-src="${proof.proof}">` : `<div class="thumb-placeholder">no proof</div>`}
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              ${['verified','needs_review','rejected'].map(s => `<button class="btn btn-sm" data-role="set-bonus-review" data-id="${b.id}" data-target="${t.id}" data-status="${s}"
                style="${reviewStatus===s ? `background:${REVIEW_STATUS_META[s].bg};border-color:${REVIEW_STATUS_META[s].bg};color:${REVIEW_STATUS_META[s].fg};` : ''}">${REVIEW_STATUS_META[s].short}</button>`).join('')}
              ${review ? `<button class="btn btn-sm" data-role="set-bonus-review" data-id="${b.id}" data-target="${t.id}" data-status="">Clear</button>` : ''}
            </div>
          </div>`;
        });
      }
    }
    html += `</div>`;
    return html;
  },

  renderModal(){
    const m = this.state.modal;
    if(m.type === 'image'){
      return `<div class="modal-overlay" data-role="modal-overlay"><div class="modal">
        <button class="modal-close" data-role="modal-close">&times;</button>
        <div class="serif" style="font-size:16px;">Proof</div>
        <img src="${m.src}">
      </div></div>`;
    }
    // Admin proof review: the full photo next to that week's day-by-day
    // steps, with a right/wrong toggle per day — so the admin can check the
    // photo against each claimed day without hunting between the thumbnail
    // and the table below it. Separate from setWeekReviewStatus()'s
    // whole-week verdict, which is unaffected by this.
    if(m.type === 'proofReview'){
      const rec = this.state.allSteps[m.uid] || { days:{} };
      const cfg = this.state.config;
      const dayReviews = rec.dayReviews || {};
      let dayRows = '';
      for(let d=0; d<7; d++){
        const date = this.addDays(cfg.startDate, m.weekIndex*7 + d);
        const entry = rec.days[date];
        const dow = new Date(date + 'T00:00:00Z').toLocaleDateString('en-US', { weekday:'short', timeZone:'UTC' });
        const review = dayReviews[date];
        const status = review ? review.status : null;
        dayRows += `<div class="day-review-row">
          <div class="day-review-date"><span class="dow">${dow}</span> ${this.formatDate(date)}</div>
          <div class="day-review-steps">${entry ? entry.steps.toLocaleString() + ' steps' : '—'}</div>
          <div class="day-review-actions">
            <button class="btn btn-sm${status==='correct' ? ' active-correct' : ''}" data-role="set-day-review" data-uid="${m.uid}" data-date="${date}" data-status="correct">✓ Right</button>
            <button class="btn btn-sm${status==='incorrect' ? ' active-incorrect' : ''}" data-role="set-day-review" data-uid="${m.uid}" data-date="${date}" data-status="incorrect">✗ Wrong</button>
          </div>
        </div>`;
      }
      return `<div class="modal-overlay" data-role="modal-overlay"><div class="modal modal-wide">
        <button class="modal-close" data-role="modal-close">&times;</button>
        <div class="serif" style="font-size:16px;margin-bottom:12px;">Proof — Week ${m.weekIndex+1}</div>
        <div class="proof-review-layout">
          <img class="proof-review-img" src="${m.src}">
          <div class="proof-review-days">${dayRows}</div>
        </div>
      </div></div>`;
    }
    return '';
  },

    root.querySelectorAll('[data-role="lb-mode"]').forEach(el => el.addEventListener('click', () => { this.state.lbMode = el.dataset.mode; this.state.lbExpanded = false; this.render(); }));

      const w = Number(el.dataset.week);

    root.querySelectorAll('[data-role="toggle-race-expand"]').forEach(el => el.addEventListener('click', () => {

    root.querySelectorAll('[data-role="toggle-participant-team"]').forEach(el => el.addEventListener('click', () => {

    }));

        description: document.getElementById('in-bonus-desc').value,
        reminder: document.getElementById('in-bonus-reminder').value,
        points: document.getElementById('in-bonus-points').value,
        type: document.getElementById('in-bonus-type').value,

    root.querySelectorAll('[data-role="toggle-award"]').forEach(el => el.addEventListener('click', () => this.toggleAward(el.dataset.id, el.dataset.target)));
    root.querySelectorAll('[data-role="bonus-proof-input"]').forEach(el => el.addEventListener('change', () => this.handleBonusProofFile(el.dataset.bonus, el)));
    root.querySelectorAll('[data-role="remove-bonus-proof"]').forEach(el => el.addEventListener('click', () => this.removeBonusProof(el.dataset.bonus)));
    root.querySelectorAll('[data-role="load-bonus-proofs"]').forEach(el => el.addEventListener('click', () => this.loadBonusProofsFor(el.dataset.id)));
    root.querySelectorAll('[data-role="set-bonus-review"]').forEach(el => el.addEventListener('click', () => this.setBonusReviewStatus(el.dataset.id, el.dataset.target, el.dataset.status || null)));
    root.querySelectorAll('[data-role="bonus-manage-filter"]').forEach(el => el.addEventListener('click', () => { this.state.bonusManageFilter = el.dataset.filter; this.render(); }));
    // Name and "awarded only" filter the same award-grid together, so each
    // has to consider the other's current value rather than just its own.
    const updateAwardChips = (card) => {
      const textInput = card.querySelector('[data-role="bonus-filter"]');
      const awardedOnly = card.querySelector('[data-role="bonus-awarded-filter"]');
      const q = textInput ? textInput.value.trim().toLowerCase() : '';
      const onlyAwarded = awardedOnly ? awardedOnly.checked : false;
      const grid = card.querySelector('.award-grid');
      if(!grid) return;
      grid.querySelectorAll('.award-chip').forEach(chip => {
        const matchesText = q === '' || chip.dataset.name.includes(q);
        const matchesAwarded = !onlyAwarded || chip.classList.contains('awarded');
        chip.style.display = (matchesText && matchesAwarded) ? '' : 'none';
      });
    };
    root.querySelectorAll('[data-role="bonus-filter"]').forEach(input => {
      input.addEventListener('input', () => updateAwardChips(input.closest('.challenge-card')));
    });
    root.querySelectorAll('[data-role="bonus-awarded-filter"]').forEach(input => {
      input.addEventListener('change', () => updateAwardChips(input.closest('.challenge-card')));
    });
  }
};

window.App = App;
App.init();
</script>
</body>
</html>
