<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OH APAC — Steps Challenge</title>
<link rel="icon" type="image/png" href="assets/otters/otter-sg.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap');

:root{
  --bg:#F5F2EE;
  --panel:#FFFFFF;
  --ink:#2A1F1F;
  --ink-soft:#63574F;
  --line:#E0D9D0;
  --line-strong:#C4B9AC;
  --forest:#8A000A;
  --forest-dark:#5A0007;
  --forest-tint:#EDD9DA;
  --amber:#B9871F;
  --amber-tint:#F4E7CB;
  --rust:#8B4A3B;
  --rust-tint:#F1DFD9;
  --plum:#6A4C6E;
  --plum-tint:#EBE2EC;
}
*{box-sizing:border-box;-webkit-text-size-adjust:100%;}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Frutiger 45 Light', 'Frutiger Light', Frutiger, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  font-weight:300;
  font-size:15px;
  line-height:1.5;
}
h1,h2,h3,.serif{font-family:'Fraunces', Georgia, serif;font-weight:600;color:var(--ink);margin:0;}
#app{max-width:960px;margin:0 auto;padding:20px 16px 70px;width:100%;}
a{color:inherit;}
img{max-width:100%;}

/* ---------- Login ---------- */
.login-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:16px;}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:32px 28px;max-width:420px;width:100%;}
.login-hero{font-family:'Fraunces', Georgia, serif;font-weight:600;font-size:28px;letter-spacing:-0.01em;margin-bottom:6px;}
.login-sub{color:var(--ink-soft);margin-bottom:24px;font-size:14px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:6px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
.field textarea{resize:vertical;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--forest);outline-offset:1px;}
.privacy-note{font-size:12px;color:var(--ink-soft);margin-top:16px;line-height:1.5;}
.back-link{background:none;border:none;color:var(--forest);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;font-family:inherit;margin-bottom:14px;display:inline-block;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;border:1px solid var(--line-strong);background:#fff;color:var(--ink);font-size:14px;font-family:inherit;cursor:pointer;}
.btn:hover{border-color:var(--forest);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn-primary{background:var(--forest);border-color:var(--forest);color:#fff;}
.btn-primary:hover{background:var(--forest-dark);border-color:var(--forest-dark);}
.btn-block{width:100%;justify-content:center;}
.btn-sm{padding:5px 10px;font-size:13px;}
.btn-danger{color:var(--rust);border-color:var(--rust);background:#fff;}

/* ---------- Header ---------- */
.header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.header .title{font-size:23px;letter-spacing:-0.01em;}
.header .who{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.header .who button{background:none;border:none;color:var(--forest);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;font-family:inherit;}
.status-pill{background:var(--forest-tint);color:var(--forest-dark);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:500;white-space:nowrap;}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap;overflow-x:auto;}
.tab{padding:9px 14px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--ink-soft);white-space:nowrap;}
.tab.active{color:var(--forest-dark);border-bottom-color:var(--forest);font-weight:500;}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.subtab{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);}
.subtab.active{background:var(--forest);border-color:var(--forest);color:#fff;}

/* ---------- Trail checkpoint graphic ---------- */
.trail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:40px 20px 18px;margin-bottom:20px;}
.trail-track{display:flex;align-items:center;}
.trail-dot-wrap{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.trail-line-row{display:flex;align-items:center;width:100%;}
.trail-line{height:2px;flex:1;background:var(--line-strong);}
.trail-line.filled{background:var(--forest);}
.week-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-strong);background:#fff;flex-shrink:0;}
.week-dot.done{background:var(--forest);border-color:var(--forest);}
.week-dot.partial{background:var(--amber);border-color:var(--amber);}
.week-dot.today{box-shadow:0 0 0 3px var(--amber-tint);border-color:var(--amber);}
.week-dot.upcoming{opacity:0.5;}
.trail-dot-label{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.trail-otter{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25));animation:otter-walk 0.6s ease-in-out infinite;}

/* ---------- Otter mascots ---------- */
.header-logo{width:32px;height:32px;object-fit:contain;vertical-align:middle;margin-right:8px;}
.login-hero-otter{display:block;margin:0 auto 14px;width:130px;height:auto;}
.race-panel h3{margin-bottom:2px;}
.race-caption{font-size:12px;color:var(--ink-soft);margin:12px 0 6px;}
.race-caption:first-of-type{margin-top:4px;}
.race-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.race-row:last-child{margin-bottom:0;}
.race-name{width:80px;flex-shrink:0;font-size:12px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.race-lane-track{position:relative;flex:1;min-width:0;height:56px;border-radius:10px;
  background:linear-gradient(180deg,var(--forest-tint) 0%,#D9A3A8 55%,#B96A70 100%);
  border:1px solid var(--line);overflow:visible;z-index:0;}
.race-lane-otter{position:absolute;top:2px;width:48px;height:48px;object-fit:contain;
  transform:translateX(-50%) scaleX(-1);transition:left 0.6s ease;z-index:2;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25));animation:otter-walk-flipped 0.6s ease-in-out infinite;}
/* A waddling walk cycle using just rotation/bob on the static artwork (no
   sprite frames to animate between) — folds translateX(-50%) into every
   keyframe since that's how both otter classes stay centered on their
   position, and an animation's transform replaces rather than composes with
   the base rule's. The race track's otter also mirrors horizontally
   (scaleX(-1)) so it faces right, the direction it's racing — its own
   keyframe set bakes that in too, with the wobble's rotate sign flipped so
   it still *looks* like the same wobble once mirrored. */
@keyframes otter-walk{
  0%,100%{transform:translateX(-50%) translateY(0) rotate(0deg);}
  25%{transform:translateX(-50%) translateY(-4px) rotate(-6deg);}
  50%{transform:translateX(-50%) translateY(0) rotate(0deg);}
  75%{transform:translateX(-50%) translateY(-4px) rotate(6deg);}
}
@keyframes otter-walk-flipped{
  0%,100%{transform:translateX(-50%) scaleX(-1) translateY(0) rotate(0deg);}
  25%{transform:translateX(-50%) scaleX(-1) translateY(-4px) rotate(6deg);}
  50%{transform:translateX(-50%) scaleX(-1) translateY(0) rotate(0deg);}
  75%{transform:translateX(-50%) scaleX(-1) translateY(-4px) rotate(-6deg);}
}
@media (prefers-reduced-motion: reduce){
  .trail-otter,.race-lane-otter{animation:none;}
}
.race-lane-finish{position:absolute;right:8px;top:4px;bottom:4px;width:3px;z-index:1;
  background:repeating-linear-gradient(180deg,#fff 0 6px,rgba(31,42,31,0.4) 6px 12px);}
.race-value{font-size:10px;color:var(--ink-soft);margin-top:2px;}
.race-axis-row{margin-bottom:6px;}
.race-axis{flex:1;display:flex;justify-content:space-between;font-size:10px;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:0.05em;padding:0 4px;}

/* ---------- Leaderboard ---------- */
.lb-mode-toggle{display:flex;gap:6px;margin-bottom:14px;}
.lb-mode-btn{padding:6px 16px;border-radius:20px;font-size:13px;cursor:pointer;background:#fff;border:1px solid var(--line-strong);color:var(--ink-soft);}
.lb-mode-btn.active{background:var(--forest);border-color:var(--forest);color:#fff;}
.podium-wrap{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:6px 0 0;}
.podium-block{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  width:31%;max-width:130px;border-radius:10px 10px 0 0;padding:10px 6px 12px;
  background:linear-gradient(180deg,var(--forest-tint) 0%,#D9A3A8 100%);
  border:1px solid var(--line);border-bottom:none;}
.podium-block.rank-1{height:168px;order:2;background:linear-gradient(180deg,var(--amber-tint) 0%,#E8CE8E 100%);}
.podium-block.rank-2{height:136px;order:1;}
.podium-block.rank-3{height:108px;order:3;}
/* The viewer's own podium block (or collapsed row, below) gets a ring
   around it so they can spot themselves at a glance, layered on top of
   whichever rank styling (gold/silver/bronze) already applies. */
.podium-block.mine{outline:3px solid var(--forest);outline-offset:2px;}
.podium-otter{width:44px;height:44px;object-fit:contain;margin-bottom:6px;filter:drop-shadow(0 2px 2px rgba(0,0,0,0.25));}
.podium-rank{font-family:'Fraunces',Georgia,serif;font-size:20px;font-weight:700;color:var(--forest-dark);line-height:1;}
.podium-name{font-size:13px;font-weight:500;text-align:center;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.podium-value{font-size:11px;color:var(--ink-soft);margin-top:2px;text-align:center;}
.podium-base-bar{height:12px;background:var(--line-strong);border-radius:0 0 8px 8px;margin:0 auto;max-width:420px;}

.collapsed-list{margin-top:16px;}
.collapsed-row{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13px;}
.collapsed-row:last-child{border-bottom:none;}
.collapsed-row.mine{background:var(--forest-tint);border-radius:6px;padding-left:6px;padding-right:6px;font-weight:600;}
.collapsed-rank{color:var(--ink-soft);width:26px;flex-shrink:0;}
.collapsed-name{flex:1;}
.collapsed-value{color:var(--ink-soft);font-size:12px;}
.expand-toggle{background:none;border:none;color:var(--forest);text-decoration:underline;cursor:pointer;font-size:13px;padding:0;font-family:inherit;margin-top:10px;}

/* ---------- Week cards ---------- */
.week-list{display:flex;flex-direction:column;gap:12px;margin-bottom:6px;}
.week-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}
.week-card.locked{background:#F7F8F5;}
.wtop{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.wtop .wname{font-weight:500;font-size:15px;}
.wtop .wdates{font-size:12px;color:var(--ink-soft);margin-left:8px;}
.wbody{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.steps-input{width:130px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;font-family:inherit;font-size:14px;}
.steps-readout{font-size:15px;font-weight:500;}
.thumb{width:48px;height:48px;border-radius:6px;object-fit:cover;border:1px solid var(--line);cursor:pointer;}
.thumb-placeholder{width:48px;height:48px;border-radius:6px;border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-soft);text-align:center;}
.file-label{font-size:13px;color:var(--forest);cursor:pointer;text-decoration:underline;}
.file-label input{display:none;}
.day-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
.day-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap;}
.day-date{width:96px;flex-shrink:0;}
.day-date .dow{font-size:12px;color:var(--ink-soft);}
.day-date .num{font-size:13px;font-weight:500;}
.day-body{display:flex;align-items:center;gap:10px;flex:1;flex-wrap:wrap;}
.tag{font-size:12px;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.tag-locked{background:var(--rust-tint);color:var(--rust);}
.tag-upcoming{background:#EEF0EA;color:var(--ink-soft);}
.tag-editable{background:var(--forest-tint);color:var(--forest-dark);}
.tag-awarded{background:var(--forest-tint);color:var(--forest-dark);}
.tag-pending{background:#EEF0EA;color:var(--ink-soft);}
.tag-full{background:var(--rust-tint);color:var(--rust);}
.tag-open{background:var(--forest-tint);color:var(--forest-dark);}
.tag-flag{background:var(--rust-tint);color:var(--rust);}

/* ---------- Review status pills (Excel Good/Bad/Neutral-style) ---------- */
.status-pill{display:inline-block;padding:4px 12px;border-radius:14px;font-size:12px;font-weight:500;white-space:nowrap;}
.status-pill.status-verified{background:#C6EFCE;color:#006100;}
.status-pill.status-rejected{background:#FFC7CE;color:#9C0006;}
.status-pill.status-needs_review{background:#FFEB9C;color:#9C6500;}
.status-pill.status-pending{background:#F0F0F0;color:#666666;}

/* ---------- Locked week collapsed box (My trail) ---------- */
.locked-week{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  cursor:pointer;margin-bottom:12px;}
.locked-week-label{font-size:14px;font-weight:500;}
.locked-week-total{font-size:12px;color:var(--ink-soft);font-weight:400;margin-left:6px;}
.roster-group-row{cursor:pointer;}

/* ---------- Panels / tables ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.panel h3{font-size:16px;margin-bottom:12px;}
.config-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;}
table.roster{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
table.roster th{text-align:left;font-weight:500;color:var(--ink-soft);font-size:11px;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.roster td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
.week-cell{font-size:12px;line-height:1.7;white-space:nowrap;}
.roster-actions{display:flex;flex-direction:column;gap:4px;min-width:64px;}
.role-pill{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--forest-tint);color:var(--forest-dark);}
.role-pill.admin{background:var(--amber-tint);color:#7A5A11;}

/* ---------- Teams ---------- */
.team-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.team-card .tname{font-weight:500;}
.team-card .tmeta{font-size:13px;color:var(--ink-soft);}
.member-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:6px;}
.member-row:last-child{border-bottom:none;}
.captain-tag{font-size:11px;color:var(--amber);margin-left:8px;}
.form-inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}

/* ---------- Bonus challenges ---------- */
.challenge-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;overflow:hidden;}
.challenge-card .ctop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
/* The title/description block flexes and wraps its own text; the points/
   status column next to it stays a fixed size so it doesn't get shoved
   onto its own line — and out of right-alignment — by a long description. */
.challenge-card .ctop>div:first-child{flex:1 1 220px;min-width:0;}
.challenge-card .ctop>div:last-child{flex:0 0 auto;margin-left:auto;}
.challenge-card .ctitle{font-weight:500;font-size:15px;}
.challenge-card .cdesc{font-size:13px;color:var(--ink-soft);margin-top:4px;word-wrap:break-word;}
.points-pill{background:var(--amber-tint);color:#7A5A11;font-size:12px;padding:3px 10px;border-radius:20px;white-space:nowrap;}
.type-pill{background:#EEF0EA;color:var(--ink-soft);font-size:11px;padding:2px 8px;border-radius:20px;margin-left:6px;}
.award-grid{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;}
.award-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;}
.award-chip.awarded{background:var(--forest-tint);border-color:var(--forest);color:var(--forest-dark);}

/* ---------- Fun stats ---------- */
.fun-panel{background:var(--forest-tint);border:1px solid var(--forest);border-radius:10px;padding:16px 20px;margin-bottom:20px;}
.fun-panel h3{color:var(--forest-dark);}
.fun-panel ul{margin:8px 0 0;padding-left:18px;}
.fun-panel li{margin-bottom:4px;font-size:14px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(20,26,18,0.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
.modal{background:#fff;border-radius:10px;padding:22px;max-width:480px;width:100%;max-height:85vh;overflow:auto;}
.modal img{width:100%;border-radius:6px;margin-top:10px;}
.modal .thumb{width:48px;height:48px;margin-top:0;}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;}
.modal table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;}
.modal table td, .modal table th{padding:6px 4px;border-bottom:1px solid var(--line);}
.modal-wide{max-width:720px;}
.proof-review-layout{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;margin-top:10px;}
.proof-review-img{flex:1 1 260px;max-width:320px;width:100%;border-radius:8px;border:1px solid var(--line);margin-top:0;}
.proof-review-days{flex:1 1 260px;min-width:240px;}
.day-review-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap;}
.day-review-row:last-child{border-bottom:none;}
.day-review-date{color:var(--ink-soft);flex-shrink:0;}
.day-review-date .dow{font-weight:500;color:var(--ink);margin-right:4px;}
.day-review-steps{flex:1;font-weight:500;text-align:right;padding-right:8px;}
.day-review-actions{display:flex;gap:4px;flex-shrink:0;}
.day-review-actions .btn.active-correct{background:#C6EFCE;border-color:#C6EFCE;color:#006100;}
.day-review-actions .btn.active-incorrect{background:#FFC7CE;border-color:#FFC7CE;color:#9C0006;}

.empty{color:var(--ink-soft);font-size:14px;padding:16px 0;}
.loading{color:var(--ink-soft);font-size:14px;padding:16px 0;}
.notice{background:var(--amber-tint);color:#7A5A11;border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:18px;}

@media (max-width:600px){
  .header{gap:8px;}
  .header .title{font-size:20px;}
  .race-name{width:64px;font-size:11px;}
  .week-list .wbody{gap:10px;}
  .steps-input{width:110px;}
}
/* The Participants table is the widest thing in the app and the one most
   likely to need horizontal scrolling — email is the least essential
   column at a glance (name/team/role/actions are what an admin actually
   needs), and shrinking it plus stacking the action buttons (see
   .roster-actions) both cut down how far it has to scroll to stay usable
   on a phone or a narrower laptop window, not just under 600px. */
@media (max-width:820px){
  .col-email{display:none;}
  table.roster{min-width:480px;font-size:12px;}
  table.roster th, table.roster td{padding:7px 6px;}
  .roster-actions{min-width:56px;}
  .roster-actions .btn{padding:4px 8px;font-size:12px;}
}
</style>
</head>

// Accounts are provisioned entirely by the admin (see /scripts, or the Admin
// tab) — there is no self-service sign-up. A "username" like
// trail-blazers_alice-tan is really just the local part of a synthetic
// Firebase Auth email; this suffix turns it into one consistently, both here
// and in scripts/lib/naming.js.
const USERNAME_EMAIL_DOMAIN = '@ohapac.local';
function usernameToEmail(username){
  return username.trim().toLowerCase().replace(/\s+/g, '_') + USERNAME_EMAIL_DOMAIN;
}

  init(){
    onAuthStateChanged(auth, (user) => this.handleAuthChange(user));

  async handleAuthChange(user){
    this.state.authUser = user;
    this.state.signingIn = false;
    if(!user){
      this.state.identity = null;
      this.state.mySteps = null;
      this.state.notRegistered = false;
      this.state.booting = false;
      this.render();
      return;
    }
    this.state.booting = true;
    this.render();
    await this.loadConfig();
    await this.loadUsers();
    await this.loadTeams();
    await this.loadBonus();
    const profile = this.state.users[user.uid];
    if(profile){
      this.state.identity = { uid: user.uid, name: profile.name, email: profile.email };
      // Admins get per-tab session persistence (signing out in one tab
      // doesn't sign out others, so an admin can be signed into a second
      // account in another tab) — everyone else keeps the default shared
      // local persistence so they stay signed in like before. Safe to call
      // after sign-in: it moves the already-authenticated session to the
      // new storage immediately rather than only affecting future sign-ins.
      setPersistence(auth, profile.role === 'admin' ? browserSessionPersistence : browserLocalPersistence).catch(()=>{});
      await this.enterApp();
    } else {
      // Signed in with valid credentials, but no admin-provisioned profile
      // exists — there's no self-service signup, so this account just isn't
      // set up yet (or was deleted from Firestore separately from Auth).
      this.state.notRegistered = true;
    }
    this.state.booting = false;
    this.render();
  },

  // Re-fetches everyone's totals, teams, and bonus awards on demand — same
  // data setView('myteam') already refreshes on open, but the Leaderboard

  async refreshLeaderboard(){

  // Proof photos live in their own doc (proofs/{uid}), separate from steps/{uid}
  // (daily counts + a hasProof boolean map + review status). This is what lets
  // the Leaderboard/My Team/Admin table work from small documents instead of
  // bulk-downloading everyone's embedded photos on every visit — see the
  // "Scaling to hundreds of participants" note in README for the full reasoning.
  async loadMySteps(){
    const uid = this.state.identity.uid;
    const emptySteps = { name:this.state.identity.name, email:this.state.identity.email, days:{}, hasProof:{} };
    const emptyProofs = { weekProof:{} };
    try{
      const [stepsSnap, proofsSnap] = await Promise.all([
        getDoc(doc(db,'steps',uid)),
        getDoc(doc(db,'proofs',uid))
      ]);
      // Merged over the defaults, not used bare — a steps doc can exist with
      // only `hasProof` set (created by saveMyProof() before any day was
      // ever saved), and days/hasProof must never come back undefined.
      this.state.mySteps = stepsSnap.exists() ? { ...emptySteps, ...stepsSnap.data() } : emptySteps;
      this.state.myProofs = proofsSnap.exists() ? proofsSnap.data() : emptyProofs;
    }catch(e){
      this.state.mySteps = emptySteps;
      this.state.myProofs = emptyProofs;
    }
  },
  // Computes { total, byWeek } from mySteps.days — stored redundantly on the
  // user's own users/{uid} doc (written in the same batch as steps/{uid}) so
  // the Leaderboard and My Team tabs can read everyone's totals straight off
  // the `users` collection they already fetch at boot, instead of needing a
  // separate bulk read of the whole `steps` collection.
  computeTotals(days){
    const cfg = this.state.config;
    const byWeek = [];
    for(let w=0; w<cfg.weeks; w++){
      let sum = 0;
      if(cfg.startDate){
        for(let d=0; d<7; d++){
          const date = this.addDays(cfg.startDate, w*7 + d);
          const entry = days[date];
          if(entry) sum += entry.steps || 0;
        }
      }
      byWeek.push(sum);
    }
    const total = Object.values(days).reduce((s,d)=>s+(d.steps||0),0);
    return { total, byWeek };
  },
  async saveMySteps(){
    const uid = this.state.identity.uid;
    const { total, byWeek } = this.computeTotals(this.state.mySteps.days);
    const batch = writeBatch(db);
    // set+merge, and only the fields this actually changes (days) — a plain
    // overwrite of the whole cached mySteps object would risk clobbering
    // hasProof/verified back to whatever this tab last loaded, if either
    // changed elsewhere (another tab's proof upload, an admin's review)
    // since then.
    batch.set(doc(db,'steps',uid), { name:this.state.mySteps.name, email:this.state.mySteps.email, days:this.state.mySteps.days }, { merge:true });
    batch.update(doc(db,'users',uid), { total, byWeek });
    await batch.commit();
    if(this.state.users[uid]) Object.assign(this.state.users[uid], { total, byWeek });
  },
  async saveMyProof(weekIndex, dataUrl){
    const uid = this.state.identity.uid;
    const entry = { proof: dataUrl, submittedAt: new Date().toISOString() };
    const batch = writeBatch(db);
    // set+merge (deep-merges nested maps) rather than building the full
    // weekProof object from the local cache and overwriting — if another
    // tab/device uploaded a different week's proof since this one last
    // loaded, a full overwrite here would silently drop it.
    batch.set(doc(db,'proofs',uid), { weekProof: { [weekIndex]: entry } }, { merge:true });
    batch.set(doc(db,'steps',uid), { hasProof: { [weekIndex]: true } }, { merge:true });
    await batch.commit();
    if(!this.state.myProofs.weekProof) this.state.myProofs.weekProof = {};
    this.state.myProofs.weekProof[weekIndex] = entry;
    if(!this.state.mySteps.hasProof) this.state.mySteps.hasProof = {};
    this.state.mySteps.hasProof[weekIndex] = true;
  },
  async removeMyProof(weekIndex){
    if(!confirm("Remove this week's proof photo?")) return;
    const uid = this.state.identity.uid;
    const batch = writeBatch(db);
    batch.set(doc(db,'proofs',uid), { weekProof: { [weekIndex]: deleteField() } }, { merge:true });
    batch.set(doc(db,'steps',uid), { hasProof: { [weekIndex]: false } }, { merge:true });
    await batch.commit();
    if(this.state.myProofs.weekProof) delete this.state.myProofs.weekProof[weekIndex];
    if(this.state.mySteps.hasProof) this.state.mySteps.hasProof[weekIndex] = false;
    this.render();
  },

  // Admin-only: the full steps collection (daily counts, hasProof flags,
  // review status — no photos, those are fetched per-person on demand from
  // `proofs`). Only the Admin tab triggers this; Leaderboard and My Team read
  // totals straight off `users` instead. See setView().
  async loadAllSteps(){
    this.state.allStepsLoaded = false;
    this.render();
    try{
      const snap = await getDocs(collection(db,'steps'));
      const results = {};
      snap.forEach(d => { results[d.id] = d.data(); });
      this.state.allSteps = results;
    }catch(e){ this.state.allSteps = {}; }
    this.state.allStepsLoaded = true;
    this.render();
  },
  // Fetches one specific person's proof photos on demand (admin detail modal,
  // AI audit) — never bulk-loaded for everyone at once.
  async loadProofsFor(uid){
    if(this.state.viewedProofs[uid]) return this.state.viewedProofs[uid];
    try{
      const snap = await getDoc(doc(db,'proofs',uid));
      this.state.viewedProofs[uid] = snap.exists() ? snap.data() : { weekProof:{} };
    }catch(e){
      this.state.viewedProofs[uid] = { weekProof:{} };
    }
    return this.state.viewedProofs[uid];
  },
  // Bulk-fetches every participant's photos at once — only for the two admin
  // actions that genuinely need all of them (the proof gallery, the ZIP
  // export), triggered deliberately by a button click, never automatically.
  async loadAllProofs(){
    if(this.state.allProofsLoaded || this.state.allProofsLoading) return;
    this.state.allProofsLoading = true;
    this.render();
    try{
      const snap = await getDocs(collection(db,'proofs'));
      const results = {};
      snap.forEach(d => { results[d.id] = d.data(); });
      this.state.allProofs = results;
    }catch(e){ this.state.allProofs = {}; }
    this.state.allProofsLoaded = true;
    this.state.allProofsLoading = false;
    this.render();
  },

  // ---------- Login flow ----------
  // Accounts (username, password, profile, team) are all provisioned ahead of
  // time by the admin — see /scripts. There is no self-service sign-up here.
  friendlyAuthError(e){
    const code = e && e.code ? e.code : '';
    if(code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') return 'Incorrect username or password.';
    if(code === 'auth/too-many-requests') return 'Too many attempts — wait a moment and try again.';
    if(code === 'auth/operation-not-allowed') return 'Sign-in isn’t enabled yet. Ask an admin to enable Email/Password in Firebase.';
    return 'Sign-in failed. Please try again.';
  },
  async signInWithUsername(username, password){
    username = (username || '').trim();
    if(!username || !password){ this.state.error = 'Enter your username and password.'; this.render(); return; }
    this.state.error = null;
    this.state.signingIn = true;
    this.render();
    try{
      await signInWithEmailAndPassword(auth, usernameToEmail(username), password);
    }catch(e){
      this.state.error = this.friendlyAuthError(e);
      this.state.signingIn = false;
      this.render();
    }
  },
  async enterApp(){
    await this.loadMySteps();
    await this.loadMyBonusProofs();
    this.state.view = 'trail';
  },
  // Own bonus proof photos — the bonusProofs doc(s) that are actually theirs
  // (their own uid for individual challenges, their team's id for team
  // ones), loaded once at login same as loadMySteps() loads their own
  // steps/proofs doc. Never touches another person's or team's doc, so this
  // stays a small, personal fetch rather than the bulk admin-only load
  // loadBonusProofsFor() does.
  async loadMyBonusProofs(){
    const uid = this.state.identity.uid;
    const myTeam = this.getMyTeam();
    const ids = myTeam ? [uid, myTeam.id] : [uid];
    const merged = {};
    await Promise.all(ids.map(async id => {
      const snap = await getDoc(doc(db,'bonusProofs',id));
      if(snap.exists()) Object.assign(merged, snap.data());
    }));
    this.state.myBonusProofs = merged;
  },

  async switchIdentity(){
    try{ await signOut(auth); }catch(e){}
  },

  setView(v){
    this.state.view = v;
    // Only the Admin tab needs the full steps collection (per-week breakdown,
    // proof flags, review status) — Leaderboard and My Team read totals off
    // `users` instead (see userTotal()/userWeekTotal()), so they don't
    // trigger this bulk, admin-only fetch.
    if(v === 'admin' && !this.state.allStepsLoaded){
      this.loadAllSteps();
    } else if(v === 'myteam'){
      // Refreshes everyone's totals so the week race reflects a teammate's
      // steps as soon as you open this tab, not just whatever was loaded
      // at login — there's no realtime listener, so this is "current as of
      // your last visit" rather than a live push while the tab stays open.
      this.render();
      this.loadUsers().then(() => this.render());
    } else {
      this.render();
    }
  },

  // ---------- Date helpers (fixed Singapore time, UTC+8) ----------
  sgtNow(){ return new Date(Date.now() + 8*60*60*1000); },
  sgtToday(){ return this.sgtNow().toISOString().slice(0,10); },
  addDays(dateStr, n){
    const d = new Date(dateStr + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0,10);
  },
  daysBetween(a,b){ return Math.round((new Date(b+'T00:00:00Z') - new Date(a+'T00:00:00Z')) / 86400000); },
  formatDate(dateStr){
    const d = new Date(dateStr + 'T00:00:00Z');
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric', timeZone:'UTC' });
  },
  weekDateRange(weekIndex){
    const cfg = this.state.config;
    const start = this.addDays(cfg.startDate, weekIndex*7);
    const end = this.addDays(cfg.startDate, weekIndex*7+6);
    return this.formatDate(start) + ' – ' + this.formatDate(end);
  },

  getChallengeStatus(){
    const cfg = this.state.config;
    if(!cfg || !cfg.startDate) return { started:false };
    const today = this.sgtToday();
    const dayIndex = this.daysBetween(cfg.startDate, today);
    const totalDays = cfg.weeks * 7;
    if(dayIndex < 0) return { started:false, startsIn: -dayIndex };
    if(dayIndex >= totalDays) return { started:true, ended:true, dayIndex, weekIndex: cfg.weeks-1 };
    return { started:true, ended:false, dayIndex, weekIndex: Math.floor(dayIndex/7) };
  },

  // PRESTART = the actual start date hasn't arrived yet (or none is set) —
  // team details (rosters, teams, who's on what) are only ever editable
  // during this phase. Once the challenge has actually started, they're
  // frozen for the rest of the event; this is the single check every
  // team-editing action (sync, add, clear, assign, join, leave, remove)
  // goes through.
  isPrestart(){
    return !this.getChallengeStatus().started;
  },
  // A week's data (steps + proof) stays editable until the following Monday
  // at noon, Singapore time — giving people the weekend plus Monday morning
  // to log the previous week's steps rather than locking the instant the
  // next week begins.
  weekDeadline(weekIndex){
    const monday = this.addDays(this.state.config.startDate, weekIndex*7 + 7);
    return new Date(monday + 'T12:00:00Z');
  },
  isPastWeekDeadline(weekIndex){
    if(!this.state.config.startDate) return true;
    return this.sgtNow() >= this.weekDeadline(weekIndex);
  },
  getWeekStatus(weekIndex){
    const status = this.getChallengeStatus();
    if(!status.started) return 'not-started';
    const inGrace = !this.isPastWeekDeadline(weekIndex);
    if(status.ended){
      if(weekIndex === status.weekIndex && inGrace) return 'editable';
      return 'locked';
    }
    if(weekIndex === status.weekIndex) return 'editable';
    if(weekIndex === status.weekIndex - 1 && inGrace) return 'editable';
    if(weekIndex < status.weekIndex) return 'locked';
    return 'future';
  },

  getDayStatus(i){
    const status = this.getChallengeStatus();
    const dayWeek = Math.floor(i/7);
    if(!status.started) return 'not-started';
    const inGrace = !this.isPastWeekDeadline(dayWeek);
    if(status.ended){
      if(dayWeek === status.weekIndex && inGrace) return 'editable';
      return 'locked';
    }
    if(dayWeek < status.weekIndex){
      if(dayWeek === status.weekIndex - 1 && inGrace) return 'editable';
      return 'locked';
    }
    if(dayWeek === status.weekIndex){
      if(i < status.dayIndex) return 'editable';
      if(i === status.dayIndex) return 'editable-today';
      return 'future';
    }
    return 'future-week';
  },

  totalStepsOf(record){
    if(!record) return 0;
    return Object.values(record.days || {}).reduce((s,d)=>s+(d.steps||0),0);
  },
  totalStepsInRange(record, sel){
    if(!record) return 0;
    if(sel === 'overall') return this.totalStepsOf(record);
    const cfg = this.state.config;
    if(!cfg.startDate) return 0;
    let sum = 0;
    for(let d=0; d<7; d++){
      const date = this.addDays(cfg.startDate, sel*7 + d);
      const entry = record.days[date];
      if(entry) sum += entry.steps || 0;
    }
    return sum;
  },
  weekProofOf(record, weekIndex){
    return record && record.weekProof ? record.weekProof[weekIndex] : null;
  },
  // A week-scoped bonus challenge only shows to participants during its own
  // week; an overall-scoped one always shows. Admins still see everything
  // in the Manage & award list regardless of week, since they need to set
  // up or review challenges outside the current week too.
  isBonusVisibleNow(b){
    if(b.scope !== 'week') return true;
    const status = this.getChallengeStatus();
    if(!status.started) return false;
    return b.weekIndex === status.weekIndex;
  },
  // Reads a participant's precomputed total/byWeek straight off their
  // users/{uid} doc (already fetched at boot for everyone) — used by
  // Leaderboard and My Team so those views never need to bulk-fetch the
  // whole `steps` collection just to add up totals.
  userTotal(uid){
    const u = this.state.users[uid];
    return u && u.total ? u.total : 0;
  },
  userWeekTotal(uid, sel){
    if(sel === 'overall') return this.userTotal(uid);
    const u = this.state.users[uid];
    return u && u.byWeek && u.byWeek[sel] ? u.byWeek[sel] : 0;
  },

  // ---------- Daily steps entry, weekly proof ----------
  async saveDay(date){
    const draftVal = this.state.draftSteps[date];
    const existing = this.state.mySteps.days[date] || {};
    const steps = draftVal !== undefined && draftVal !== '' ? Number(draftVal) : (existing.steps ?? null);
    if(steps === null || isNaN(steps)){ alert('Enter a step count before saving.'); return; }
    if(steps > DAILY_STEP_CAP){
      alert("That's above the maximum of " + DAILY_STEP_CAP.toLocaleString() + " steps allowed for a single day.");
      return;
    }
    const cfg = this.state.config;
    const limit = cfg.stepsLimit;
    if(limit && steps > limit){
      alert("That's above the maximum of " + limit.toLocaleString() + " steps per day set by the admin.");
      return;
    }
    const dayIndex = this.daysBetween(cfg.startDate, date);
    const weekIndex = Math.floor(dayIndex/7);
    if(this.isPastWeekDeadline(weekIndex)){
      alert('The deadline to enter steps for that week (Monday noon) has passed.');
      return;
    }
    this.state.mySteps.days[date] = { steps, submittedAt: new Date().toISOString() };
    delete this.state.draftSteps[date];
    delete this.state.editingDays[date];
    await this.saveMySteps();
    this.render();
  },
  editDay(date){
    this.state.editingDays[date] = true;
    this.render();
  },

  async handleWeekProofFile(weekIndex, inputEl){
    const file = inputEl.files[0];
    if(!file) return;
    try{
      const dataUrl = await this.compressImage(file);
      await this.saveMyProof(weekIndex, dataUrl);
      this.render();
    }catch(e){ alert('Could not process that image. Try a different file.'); }
  },

  compressImage(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 800;
          let w = img.width, h = img.height;
          if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
          else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.6));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  },

  // ---------- Teams ----------
  getMyTeam(){
    const me = this.state.users[this.state.identity.uid];
    if(!me || !me.teamId) return null;
    return this.state.teams[me.teamId] || null;
  },
  slugify(name){
    return name.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'team';
  },
  async leaveTeam(){
    if(!this.isPrestart()){ alert('The challenge has started — team details are locked.'); return; }
    const uid = this.state.identity.uid;
    const me = this.state.users[uid];
    const team = this.state.teams[me.teamId];
    if(!team) return;
    if(!confirm('Leave ' + team.name + '?')) return;
    const members = team.members.filter(m => m !== uid);
    if(members.length === 0){
      await deleteDoc(doc(db,'teams',team.id));
      delete this.state.teams[team.id];
    } else {
      const captainUid = team.captainUid === uid ? members[0] : team.captainUid;
      await updateDoc(doc(db,'teams',team.id), { members, captainUid });
      team.members = members;
      team.captainUid = captainUid;
    }
    await updateDoc(doc(db,'users',uid), { teamId:null });
    me.teamId = null;
    this.render();
  },
  async removeMember(teamId, targetUid){
    if(!this.isPrestart()){ alert('The challenge has started — team details are locked.'); return; }
    const team = this.state.teams[teamId];
    if(!team) return;
    if(team.captainUid !== this.state.identity.uid){ alert('Only the captain can remove members.'); return; }
    if(targetUid === team.captainUid){ alert('The captain should use "Leave team" instead.'); return; }
    if(!confirm('Remove this person from ' + team.name + '?')) return;
    const members = team.members.filter(m => m !== targetUid);
    await updateDoc(doc(db,'teams',teamId), { members });
    team.members = members;
    if(this.state.users[targetUid]){
      await updateDoc(doc(db,'users',targetUid), { teamId:null });
      this.state.users[targetUid].teamId = null;
    }
    this.render();
  },
  // Self-service joining — the safety net for anyone left without a team (a
  // roster sync unassigns rather than deletes, and a captain can remove a
  // member) so they're not stuck waiting on an admin. Not the same as the
  // old team-creation/browser flow that was removed: this only lets someone
  // join a team an admin/roster-sync already created, never create a new one.
  async joinTeam(teamId){
    const uid = this.state.identity.uid;
    const isAdminSelf = (this.state.users[uid] || {}).role === 'admin';
    if(!this.isPrestart() && !isAdminSelf){ alert('The challenge has started — team details are locked.'); return; }
    const MAX_TEAM_SIZE = 5;
    const team = this.state.teams[teamId];
    if(!team) return;
    if(team.members.includes(uid)) return;
    if(team.members.length >= MAX_TEAM_SIZE){ alert(`${team.name} is already full.`); return; }
    if(!confirm(`Join ${team.name}?`)) return;
    const members = [...team.members, uid];
    await updateDoc(doc(db,'teams',teamId), { members });
    team.members = members;
    await updateDoc(doc(db,'users',uid), { teamId });
    this.state.users[uid].teamId = teamId;
    this.render();
  },
  // Admin-only counterpart to joinTeam()/leaveTeam() — moves ANY participant
  // (not just yourself) onto a team, off one entirely (newTeamId === ''), or
  // between two, from the Participants table's Team dropdown. Lets an admin
  // add someone with no team yet (leave the sync/add-participant team name
  // blank) and assign them afterward.
  async assignTeam(uid, newTeamId){
    const u = this.state.users[uid];
    if(!u) return;
    if(!this.isPrestart() && u.role !== 'admin'){ alert('The challenge has started — team details are locked.'); this.render(); return; }
    const MAX_TEAM_SIZE = 5;
    newTeamId = newTeamId || null;
    if(u.teamId === newTeamId) return;

    if(newTeamId){
      const newTeam = this.state.teams[newTeamId];
      if(!newTeam){ alert('That team no longer exists — refreshing.'); await this.loadTeams(); this.render(); return; }
      if(newTeam.members.length >= MAX_TEAM_SIZE){ alert(`${newTeam.name} is already full.`); this.render(); return; }
    }

    if(u.teamId){
      const oldTeam = this.state.teams[u.teamId];
      if(oldTeam){
        const members = oldTeam.members.filter(m => m !== uid);
        if(members.length === 0){
          const teamRef = doc(db,'teams',oldTeam.id);
          try{ await updateDoc(teamRef, { members: [] }); }catch(e){ if(e.code !== 'not-found') throw e; }
          await deleteDoc(teamRef);
          delete this.state.teams[oldTeam.id];
        } else {
          const captainUid = oldTeam.captainUid === uid ? members[0] : oldTeam.captainUid;
          await updateDoc(doc(db,'teams',oldTeam.id), { members, captainUid });
          oldTeam.members = members; oldTeam.captainUid = captainUid;
        }
      }
    }

    if(newTeamId){
      const newTeam = this.state.teams[newTeamId];
      const members = [...newTeam.members, uid];
      await updateDoc(doc(db,'teams',newTeamId), { members });
      newTeam.members = members;
    }

    await updateDoc(doc(db,'users',uid), { teamId: newTeamId });
    u.teamId = newTeamId;
    this.render();
  },
  // Wipes every non-admin's profile, step data, and team — prestart only,
  // same operation a roster re-key does automatically before recreating
  // everyone. A manual way to fully clear the slate without uploading a
  // (possibly empty) roster to do it.
  async clearAllParticipants(){
    if(!this.isPrestart()){ alert('The challenge has started — team details are locked.'); return; }
    if(!confirm('This permanently deletes every participant\'s profile, step data, and team. Continue?')) return;
    await this.loadUsers();
    await this.loadTeams();
    const toWipe = Object.values(this.state.users).filter(u => u.role !== 'admin');
    for(const u of toWipe){
      await deleteDoc(doc(db,'users',u.uid)).catch(()=>{});
      await deleteDoc(doc(db,'steps',u.uid)).catch(()=>{});
      await deleteDoc(doc(db,'proofs',u.uid)).catch(()=>{});
    }
    for(const teamId of Object.keys(this.state.teams)){
      const teamRef = doc(db,'teams',teamId);
      try{ await updateDoc(teamRef, { members: [] }); }catch(e){ if(e.code !== 'not-found') throw e; }
      await deleteDoc(teamRef);
    }
    await this.loadUsers();
    await this.loadTeams();
    this.state.participantActionMsg = { type:'success', text: `Cleared ${toWipe.length} participant(s) and all teams.` };
    this.render();
  },
  // Recovery for when a team doc got deleted out from under a still-intact
  // set of user profiles (e.g. accidentally deleted straight from the
  // Firebase Console, which bypasses this app — and firestore.rules —
  // entirely, so nothing here could have prevented it). Each surviving
  // profile still carries its teamId, so teams can be reconstructed by
  // grouping on that — but the team's exact display name and who was
  // captain were only ever stored on the team doc itself, so both are lost:
  // the name is approximated from the teamId slug, and the first member
  // found is arbitrarily made captain. Never overwrites a team that already
  // has a doc, so it's safe to click repeatedly.
  orphanedTeamIds(){
    const byTeam = {};
    Object.values(this.state.users).forEach(u => {
      if(u.role !== 'admin' && u.teamId && !this.state.teams[u.teamId]){
        (byTeam[u.teamId] = byTeam[u.teamId] || []).push(u);
      }
    });
    return byTeam;
  },
  async rebuildTeamsFromProfiles(){
    if(!this.isPrestart()){ alert('The challenge has started — team details are locked.'); return; }
    const orphaned = this.orphanedTeamIds();
    const count = Object.keys(orphaned).length;
    if(!count){ alert('Nothing to rebuild — every team referenced by a participant already has a team doc.'); return; }
    if(!confirm(`Rebuild ${count} team(s) from participant profiles? Team names will be a best guess from the team ID, and captains will be picked arbitrarily — check and fix both afterward. Continue?`)) return;
    let rebuilt = 0;
    for(const [teamId, members] of Object.entries(orphaned)){
      const guessedName = teamId.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
      await setDoc(doc(db,'teams',teamId), {
        id: teamId, name: guessedName, captainUid: members[0].uid,
        members: members.map(m => m.uid), createdAt: new Date().toISOString()
      });
      rebuilt++;
    }
    await this.loadTeams();
    this.state.participantActionMsg = { type:'success', text: `Rebuilt ${rebuilt} team(s). Double-check team names and captains in the Participants table below — both are best guesses.` };
    this.render();
  },

  // ---------- Bonus challenges ----------
  async addBonusChallenge(){
    const f = this.state.bonusForm;
    const title = f.title.trim();
    const points = Number(f.points);
    if(!title || !points || points <= 0){ alert('Give the challenge a title and a positive points value.'); return; }
    const scope = f.scope === 'week' ? 'week' : 'overall';
    const weekIndex = scope === 'week' ? Number(f.weekIndex) : null;
    const ref = doc(collection(db,'bonus'));
    const b = {
      id: ref.id, title, description: f.description.trim(), reminder: f.reminder.trim(), points, type: f.type,
      requirePhoto: !!f.requirePhoto, scope, weekIndex,
      active: true, createdAt: new Date().toISOString(), completed: [], submissions: {}, reviews: {}
    };
    await setDoc(ref, b);
    this.state.bonus[ref.id] = b;
    this.state.bonusForm = { title:'', description:'', reminder:'', points:'', type:'individual', requirePhoto:false, scope:'overall', weekIndex:0 };
    this.render();
  },
  // Submitting a proof photo just records a lightweight timestamp on the
  // bonus doc itself (cheap — that doc is loaded by everyone) and puts the
  // actual photo bytes in their own `bonusProofs` doc, mirroring how weekly
  // step proof is split from `steps/{uid}` — see the note near loadMySteps().
  async handleBonusProofFile(challengeId, inputEl){
    const file = inputEl.files[0];
    if(!file) return;
    try{
      const dataUrl = await this.compressImage(file);
      await this.submitBonusProof(challengeId, dataUrl);
      this.render();
    }catch(e){ alert('Could not process that image. Try a different file.'); }
  },
  async submitBonusProof(challengeId, dataUrl){
    const ch = this.state.bonus[challengeId];
    if(!ch) return;
    const myTeam = this.getMyTeam();
    const targetId = ch.type === 'team' ? (myTeam ? myTeam.id : null) : this.state.identity.uid;
    if(!targetId){ alert('Join a team first.'); return; }
    if(ch.scope === 'week' && Number.isInteger(ch.weekIndex) && this.isPastWeekDeadline(ch.weekIndex)){
      alert('The deadline for this challenge (Monday noon) has passed — this can no longer be changed.');
      return;
    }
    const now = new Date().toISOString();
    const batch = writeBatch(db);
    // Just a timestamp on the bonus doc — kept in its own `submissions` field,
    // separate from the admin-only `reviews` field below, so firestore.rules
    // can let a participant touch this without also opening up `reviews`
    // (see that file's comment on bonus/{bonusId}).
    batch.update(doc(db,'bonus',challengeId), { [`submissions.${targetId}`]: now });
    batch.set(doc(db,'bonusProofs',targetId), { [challengeId]: { proof: dataUrl, submittedAt: now } }, { merge:true });
    await batch.commit();
    if(!ch.submissions) ch.submissions = {};
    ch.submissions[targetId] = now;
    this.state.myBonusProofs[challengeId] = { proof: dataUrl, submittedAt: now };
    this.render();
  },
  async removeBonusProof(challengeId){
    const ch = this.state.bonus[challengeId];
    if(!ch) return;
    const myTeam = this.getMyTeam();
    const targetId = ch.type === 'team' ? (myTeam ? myTeam.id : null) : this.state.identity.uid;
    if(!targetId) return;
    if(ch.scope === 'week' && Number.isInteger(ch.weekIndex) && this.isPastWeekDeadline(ch.weekIndex)){
      alert('The deadline for this challenge (Monday noon) has passed — this can no longer be changed.');
      return;
    }
    if(!confirm('Remove your submitted proof photo?')) return;
    const batch = writeBatch(db);
    batch.update(doc(db,'bonus',challengeId), { [`submissions.${targetId}`]: deleteField() });
    batch.update(doc(db,'bonusProofs',targetId), { [challengeId]: deleteField() });
    await batch.commit();
    if(ch.submissions) delete ch.submissions[targetId];
    delete this.state.myBonusProofs[challengeId];
    this.render();
  },
  // Admin-only counterpart to setWeekReviewStatus() — an audit trail on a
  // bonus submission, kept separate from actually awarding the points
  // (toggleAward()'s `completed` list), same relationship the weekly step
  // review status has to the step counts it doesn't gate. Lives in its own
  // `reviews` field (never `submissions`) so a participant can never set
  // their own review status, even by calling Firestore directly.
  async setBonusReviewStatus(challengeId, targetId, status){
    const ch = this.state.bonus[challengeId];
    if(!ch || !ch.submissions || !ch.submissions[targetId]) return;
    const entry = status
      ? { status, verifiedBy: this.state.identity.uid, verifiedByName: this.state.identity.name, verifiedAt: new Date().toISOString() }
      : null;
    await updateDoc(doc(db,'bonus',challengeId), { [`reviews.${targetId}`]: entry });
    if(!ch.reviews) ch.reviews = {};
    ch.reviews[targetId] = entry;
    this.render();
  },
  // Photos are fetched only when an admin actually opens a challenge's
  // submissions, one bonusProofs doc per person/team who submitted —
  // never bundled into the bonus collection everyone loads at boot.
  async loadBonusProofsFor(challengeId){
    const ch = this.state.bonus[challengeId];
    if(!ch) return;
    const ids = Object.keys(ch.submissions || {});
    const results = {};
    await Promise.all(ids.map(async id => {
      const snap = await getDoc(doc(db,'bonusProofs',id));
      results[id] = snap.exists() ? (snap.data()[challengeId] || null) : null;
    }));
    this.state.viewedBonusProofs[challengeId] = results;
    this.render();
  },
  async toggleBonusActive(id){
    const next = !this.state.bonus[id].active;
    await updateDoc(doc(db,'bonus',id), { active: next });
    this.state.bonus[id].active = next;
    this.render();
  },
  async deleteBonusChallenge(id){
    if(!confirm('Delete this bonus challenge? This removes any awards already given.')) return;
    await deleteDoc(doc(db,'bonus',id));
    delete this.state.bonus[id];
    this.render();
  },
  async toggleAward(challengeId, targetId){
    const ch = this.state.bonus[challengeId];
    const idx = ch.completed.indexOf(targetId);
    const completed = [...ch.completed];
    if(idx > -1) completed.splice(idx,1); else completed.push(targetId);
    await updateDoc(doc(db,'bonus',challengeId), { completed });
    ch.completed = completed;
    this.render();
  },
  // weekIndex omitted (or 'overall') counts every awarded bonus, whatever
  // its scope — passed a specific week, only that week's own week-scoped
  // bonuses count, so a weekly leaderboard tab only reflects bonuses that
  // actually belong to that week (an overall-scoped bonus's points only
  // ever show up under the Overall tab).
  individualBonusPoints(uid, weekIndex){
    return Object.values(this.state.bonus).filter(b => {
      if(b.type !== 'individual' || !b.completed.includes(uid)) return false;
      if(weekIndex === undefined || weekIndex === 'overall') return true;
      return b.scope === 'week' && b.weekIndex === weekIndex;
    }).reduce((s,b)=>s+b.points,0);
  },
  teamBonusPoints(teamId, weekIndex){
    return Object.values(this.state.bonus).filter(b => {
      if(b.type !== 'team' || !b.completed.includes(teamId)) return false;
      if(weekIndex === undefined || weekIndex === 'overall') return true;
      return b.scope === 'week' && b.weekIndex === weekIndex;
    }).reduce((s,b)=>s+b.points,0);
  },

  // ---------- Fun stats ----------
  funMeasuresFor(steps){
    const distance = steps * 0.0008;              // km walked
    const calories = steps * 0.04;                 // calories burned
    const height = distance * 1000;                 // total distance, stood on end (m)
    const time = (distance / 4.8) * 60;              // walking time at ~4.8 km/h (minutes)
    return { distance, calories, height, time, count: steps };
  },
  formatComparison(ratio, label){
    if(ratio >= 1){
      const n = ratio >= 10 ? Math.round(ratio).toLocaleString() : ratio.toFixed(1);
      return `<strong>${n}×</strong> ${label}`;
    }
    const pct = Math.max(1, Math.round(ratio*100));
    return `<strong>${pct}%</strong> of ${label}`;
  },
  pickFunFacts(steps){
    if(!steps) return [];
    const measures = this.funMeasuresFor(steps);
    const candidates = FUN_FACT_REFS
      .map(ref => ({ ref, ratio: measures[ref.measure] / ref.value }))
      .filter(c => isFinite(c.ratio) && c.ratio > 0);
    for(let i=candidates.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
    }
    const count = Math.min(candidates.length, Math.random() < 0.5 ? 1 : 2);
    return candidates.slice(0, count).map(c => {
      const template = FUN_FACT_TEMPLATES[Math.floor(Math.random()*FUN_FACT_TEMPLATES.length)];
      return template.replace('{comparison}', this.formatComparison(c.ratio, c.ref.label));
    });
  },
  // Regenerates only when the underlying total actually changes (not on
  // every re-render), so the panel doesn't reshuffle just from switching tabs.
  getFunFacts(kind, total, extraKey){
    const factsKey = kind + 'FunFacts';
    const totalKey = kind + 'FunFactsFor';
    const cacheKey = total + ':' + (extraKey || '');
    if(this.state[totalKey] !== cacheKey){
      this.state[factsKey] = this.pickFunFacts(total);
      this.state[totalKey] = cacheKey;
    }
    return this.state[factsKey];
  },
  renderFunStats(facts){
    if(!facts || !facts.length) return '';
    return `<div class="fun-panel"><h3>Did you know?</h3><ul>${facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>`;
  },

  // ---------- Missing-proof flag ----------
  missingIssues(user){
    const rec = this.state.allSteps[user.uid] || { days:{}, hasProof:{} };
    const cfg = this.state.config;
    const issues = [];
    for(let w=0; w<cfg.weeks; w++){
      if(this.getWeekStatus(w) !== 'locked') continue;
      const weekTotal = this.totalStepsInRange(rec, w);
      const hasProof = rec.hasProof && rec.hasProof[w];
      if(!weekTotal) issues.push({ week:w, type:'missing' });
      else if(!hasProof) issues.push({ week:w, type:'no-proof' });
    }
    return issues;
  },

  // ---------- CSV export ----------
  csvEscape(v){
    v = (v===null||v===undefined) ? '' : String(v);
    if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
    return v;
  },
  downloadCSV(filename, rows){
    const csv = rows.map(r=>r.map(v=>this.csvEscape(v)).join(',')).join('\r\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },
  // One consolidated export in place of the old separate participants/teams/
  // missing-proof CSVs: every participant's name, team, and steps/audit
  // trail — grouped week by week (that week's daily steps, its total, then
  // its proof/audit columns) rather than all daily steps first and every
  // week's audit status tacked on at the end, so a whole week reads left to
  // right as one block.
  exportAllDataCSV(){
    const cfg = this.state.config;
    const header = ['Name','Email','Country','Team','Role'];
    for(let w=0; w<cfg.weeks; w++){
      for(let d=0; d<7; d++){
        const dayIndex = w*7 + d;
        header.push(cfg.startDate ? this.formatDate(this.addDays(cfg.startDate, dayIndex)) : `Week ${w+1} Day ${d+1}`);
      }
      header.push(`Week ${w+1} Total Steps`, `Week ${w+1} Proof`, `Week ${w+1} Audited`);
    }
    header.push('Total Steps','Bonus Steps','Overall Steps');
    const rows = [header];
    Object.values(this.state.users).forEach(u => {
      const rec = this.state.allSteps[u.uid] || { days:{}, hasProof:{}, verified:{} };
      const teamName = u.teamId && this.state.teams[u.teamId] ? this.state.teams[u.teamId].name : '';
      const row = [u.name, u.email, u.country||'', teamName, u.role];
      for(let w=0; w<cfg.weeks; w++){
        for(let d=0; d<7; d++){
          const dayIndex = w*7 + d;
          const date = cfg.startDate ? this.addDays(cfg.startDate, dayIndex) : null;
          const entry = date ? rec.days[date] : null;
          row.push(entry ? entry.steps : '');
        }
        const weekTotal = this.totalStepsInRange(rec, w);
        const hasProof = rec.hasProof && rec.hasProof[w];
        const review = rec.verified && rec.verified[w];
        row.push(weekTotal || '', hasProof ? 'Yes' : 'No', review ? REVIEW_STATUS_META[review.status].label : 'Not audited');
      }
      const total = this.totalStepsOf(rec);
      const bonus = this.individualBonusPoints(u.uid);
      row.push(total, bonus, total+bonus);
      rows.push(row);
    });
    this.downloadCSV('all-data.csv', rows);
  },
  async exportProofZip(){
    if(typeof JSZip === 'undefined'){ alert('The ZIP library failed to load. Check your connection and try again.'); return; }
    if(!this.state.allProofsLoaded) await this.loadAllProofs();
    const zip = new JSZip();
    let count = 0;
    Object.values(this.state.users).forEach(u => {
      const rec = this.state.allProofs[u.uid];
      if(!rec || !rec.weekProof) return;
      Object.entries(rec.weekProof).forEach(([w, entry]) => {
        if(!entry || !entry.proof) return;
        const match = /^data:image\/(\w+);base64,(.*)$/s.exec(entry.proof);
        if(!match) return;
        const ext = match[1] === 'jpeg' ? 'jpg' : match[1];
        zip.file(`${this.slugify(u.name)}_week${Number(w)+1}.${ext}`, match[2], { base64:true });
        count++;
      });
    });
    if(!count){ alert('No proof photos have been uploaded yet.'); return; }
    const blob = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'proof-photos.zip';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  },

  // ---------- Admin actions ----------
  async setRole(uid, role){
    const admins = Object.values(this.state.users).filter(u=>u.role==='admin');
    if(role === 'user' && admins.length === 1 && admins[0].uid === uid){
      alert("Can't remove the last remaining admin. Promote someone else first.");
      return;
    }
    await updateDoc(doc(db,'users',uid), { role });
    this.state.users[uid].role = role;
    this.render();
  },
  async setStartDate(dateStr){
    this.state.config.startDate = dateStr;
    await this.saveConfig();
    this.render();
  },
  async setStepsLimit(val){
    const n = Number(val);
    this.state.config.stepsLimit = val && n > 0 ? n : null;
    await this.saveConfig();
    this.render();
  },
  // ---------- Participant management (admin) ----------
  // Runs entirely client-side, no backend: ensureUserClient() creates the
  // Auth account on the throwaway `provisioningAuth` instance (see top of
  // file) so the admin's own session is untouched, then writes the
  // Firestore profile/team docs on the primary `db` — gated by
  // firestore.rules' isAdmin() check, not by anything in this code.
  async ensureUserClient(name, username, teamId, role){
    const email = usernameToEmail(username);
    const existing = Object.values(this.state.users).find(u => u.email === email);
    if(existing){
      const updates = {};
      if(existing.teamId !== teamId) updates.teamId = teamId;
      if(role && existing.role !== role) updates.role = role;
      if(Object.keys(updates).length){
        await updateDoc(doc(db,'users',existing.uid), updates);
        Object.assign(existing, updates);
      }
      return { uid: existing.uid, created:false };
    }
    let uid;
    try{
      const cred = await createUserWithEmailAndPassword(provisioningAuth, email, username);
      uid = cred.user.uid;
    }catch(e){
      if(e.code === 'auth/email-already-in-use'){
        // A login exists but its profile is missing — most likely a previous
        // add attempt created the account but failed to write the profile
        // (e.g. before firestore.rules allowed it). Since that means it was
        // never signed into and never went through the forced-password-change
        // flow, its password is still the default (same as the username) —
        // sign in as it just to recover its uid, then attach the profile.
        try{
          const cred = await signInWithEmailAndPassword(provisioningAuth, email, username);
          uid = cred.user.uid;
        }catch(e2){
          throw new Error(`"${username}" already has a login with a password that's since changed, but no profile — ask an admin to check this account manually (see scripts/README.md).`);
        }
      } else {
        throw e;
      }
    }finally{
      await signOut(provisioningAuth).catch(()=>{});
    }
    const profile = { name, email, country:'', provider:'password', role, joinedAt:new Date().toISOString(), teamId };
    await setDoc(doc(db,'users',uid), profile);
    this.state.users[uid] = { uid, ...profile };
    return { uid, created:true };
  },
  slugTeamId(teamName){
    return teamName.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'team';
  },
  // Creates a brand-new admin login straight from the website — no local
  // script, no Firebase Console, no Admin SDK key needed. Goes through the
  // same client-side ensureUserClient() as "Add a participant" (see its own
  // comment above), just with role:'admin' — deliberately not gated by
  // isPrestart() the way team rosters are, since admin accounts aren't part
  // of team setup and there's no reason to lock this once the challenge
  // starts. Username/password both follow the admin_name convention used
  // throughout (see scripts/setup-admin.js).
  async createAdmin(displayName){
    displayName = displayName.trim();
    if(!displayName){ alert('Enter a name.'); return; }
    const username = 'admin_' + displayName.toLowerCase().replace(/\s+/g, '_');
    try{
      const { uid, created } = await this.ensureUserClient(displayName, username, null, 'admin');
      this.state.adminCreateMsg = { type:'success', text: created
        ? `Created admin account for ${displayName}. Username: ${username} — password: ${username}.`
        : `${displayName} already had an account under "${username}" — made sure it's an admin.` };
    }catch(e){
      this.state.adminCreateMsg = { type:'error', text: e.message };
    }
    this.render();
  },
  async addParticipant(teamName, personName, captain){
    if(!this.isPrestart()){ alert('The challenge has started — team details are locked.'); return; }
    teamName = teamName.trim();
    personName = personName.trim();
    if(!personName){ alert('Enter a person name.'); return; }
    this.state.participantActionMsg = null;
    const MAX_TEAM_SIZE = 5;
    try{
      if(!teamName){
        // No team yet — create the account only; an admin assigns them to a
        // team later from the "Team" dropdown in the Participants table.
        const username = personName.replace(/\s+/g, '_');
        const { uid, created } = await this.ensureUserClient(personName, username, null, 'user');
        this.state.participantActionMsg = { type:'success', text: created
          ? `Created ${personName} with no team yet — assign one from the Participants table below. Username: ${username} — initial password: ${username}`
          : `${personName} already has an account under this exact name (no changes made).` };
        this.state.participantForm = { teamName:'', personName:'', captain:false };
        this.render();
        return;
      }

      const teamId = this.slugTeamId(teamName);
      const teamRef = doc(db,'teams',teamId);
      const teamSnap = await getDoc(teamRef);
      const existingMembers = teamSnap.exists() ? (teamSnap.data().members || []) : [];
      if(existingMembers.length >= MAX_TEAM_SIZE){
        throw new Error(`Team "${teamName}" already has ${MAX_TEAM_SIZE} members (the max).`);
      }

      const username = `${teamName}_${personName}`.trim().replace(/\s+/g, '_');
      const { uid, created } = await this.ensureUserClient(personName, username, teamId, 'user');

      let message;
      if(!teamSnap.exists()){
        await setDoc(teamRef, { id:teamId, name:teamName, captainUid:uid, members:[uid], createdAt:new Date().toISOString() });
        message = `Created new team "${teamName}" with ${personName} as captain.`;
        this.state.teams[teamId] = { id:teamId, name:teamName, captainUid:uid, members:[uid] };
      } else if(!existingMembers.includes(uid)){
        const update = { members:[...existingMembers, uid] };
        if(captain) update.captainUid = uid;
        await updateDoc(teamRef, update);
        message = `Added ${personName} to "${teamName}"${captain ? ' as captain' : ''}.`;
        Object.assign(this.state.teams[teamId], update);
      } else {
        message = `${personName} is already on "${teamName}".`;
      }

      this.state.participantActionMsg = { type:'success', text: created
        ? `${message} Username: ${username} — initial password: ${username}`
        : `${message} (account already existed — password left unchanged)` };
      this.state.participantForm = { teamName:'', personName:'', captain:false };
    }catch(e){
      this.state.participantActionMsg = { type:'error', text: e.message || 'Could not add participant.' };
    }
    this.render();
  },
  // Parses either a CSV file's text or a block of text pasted straight into
  // the textarea — same fixed column order either way:
  // Team Name, Captain, Member 2, Member 3, Member 4, Member 5. A first row
  // that's literally a "Team Name" header (from a spreadsheet paste) is
  // tolerated and skipped; otherwise every row is treated as data.
  parseRosterRows(text){
    const MAX_TEAM_SIZE = 5;
    const rows = text.split(/\r?\n/).map(l => l.trim()).filter(l => l !== '').map(l => l.split(',').map(c => c.trim()));
    if(!rows.length) throw new Error('Nothing to sync — provide a CSV file or paste the list.');
    const dataRows = (rows[0][0] || '').toLowerCase() === 'team name' ? rows.slice(1) : rows;

    const parsedTeams = [];
    const skipped = [];
    for(const cells of dataRows){
      const teamName = (cells[0] || '').trim();
      if(!teamName) continue;
      const memberNames = [cells[1], cells[2], cells[3], cells[4], cells[5]].map(c => (c || '').trim()).filter(Boolean);
      if(!memberNames.length){ skipped.push(`${teamName}: no captain given.`); continue; }
      if(memberNames.length > MAX_TEAM_SIZE){ skipped.push(`${teamName}: ${memberNames.length} people listed, max is ${MAX_TEAM_SIZE}.`); continue; }
      parsedTeams.push({ teamName, teamId: this.slugTeamId(teamName), captainName: memberNames[0], memberNames });
    }
    if(!parsedTeams.length) throw new Error('No valid rows found. Columns: Team Name, Captain, Member 2, Member 3, Member 4, Member 5.');
    return { parsedTeams, skipped };
  },
  // Two phases, kept deliberately simple: PRESTART (no start date reached
  // yet — see getChallengeStatus()) has no real personal data at stake, so
  // every keying of the roster fully wipes every non-admin profile, their
  // step doc, and every team, then recreates everyone fresh from this list —
  // no diffing, no "was this person here before" logic. Once START happens,
  // this refuses outright: team details are frozen for the rest of the
  // challenge (see isPrestart()).
  async syncRoster(text){
    if(!this.isPrestart()){ alert('The challenge has started — team details are locked and can no longer be changed.'); return; }
    this.state.rosterImportBusy = true;
    this.state.rosterImportResult = null;
    this.render();
    try{
      const { parsedTeams, skipped } = this.parseRosterRows(text);

      // Refresh from Firestore first — otherwise this runs against whatever
      // was cached in the browser since the admin tab was last loaded.
      await this.loadUsers();
      await this.loadTeams();

      // Wipe every current non-admin's profile + steps + proofs, and every team.
      for(const u of Object.values(this.state.users)){
        if(u.role === 'admin') continue;
        await deleteDoc(doc(db,'users',u.uid)).catch(()=>{});
        await deleteDoc(doc(db,'steps',u.uid)).catch(()=>{});
        await deleteDoc(doc(db,'proofs',u.uid)).catch(()=>{});
      }
      for(const teamId of Object.keys(this.state.teams)){
        const teamRef = doc(db,'teams',teamId);
        try{ await updateDoc(teamRef, { members: [] }); }
        catch(e){ if(e.code !== 'not-found') throw e; }
        await deleteDoc(teamRef);
      }
      await this.loadUsers();
      await this.loadTeams();

      // Recreate everyone fresh from the new list. ensureUserClient() will
      // self-heal via sign-in (rather than double-create) if someone's old
      // Firebase Auth login is still lingering from before this wipe — see
      // its own comment for why that's safe.
      const credentials = [];
      for(const { teamName, teamId, captainName, memberNames } of parsedTeams){
        const uids = [];
        let captainUid = null;
        for(const personName of memberNames){
          const username = `${teamName}_${personName}`.trim().replace(/\s+/g, '_');
          const { uid } = await this.ensureUserClient(personName, username, teamId, 'user');
          uids.push(uid);
          if(personName === captainName) captainUid = uid;
          credentials.push({ team: teamName, name: personName, username, password: username });
        }
        await setDoc(doc(db,'teams',teamId), {
          id: teamId, name: teamName, captainUid: captainUid || uids[0],
          members: uids, createdAt: new Date().toISOString()
        });
      }

      await this.loadUsers();
      await this.loadTeams();
      this.state.rosterImportResult = { credentials, skipped };
    }catch(e){
      this.state.rosterImportResult = { error: e.message || 'Sync failed.' };
    }
    this.state.rosterImportBusy = false;
    this.render();
  },
  downloadRosterCredentials(){
    const r = this.state.rosterImportResult;
    if(!r || !r.credentials || !r.credentials.length) return;
    const rows = [['Team','Name','Username','Initial Password']].concat(r.credentials.map(c=>[c.team,c.name,c.username,c.password]));
    this.downloadCSV('generated-credentials.csv', rows);
  },

  async resetChallenge(){
    if(!confirm("This clears everyone's steps and proof, and the start date. This cannot be undone. Continue?")) return;
    const [stepsSnap, proofsSnap] = await Promise.all([
      getDocs(collection(db,'steps')),
      getDocs(collection(db,'proofs'))
    ]);
    const emptyByWeek = new Array(this.state.config.weeks).fill(0);
    await Promise.all([
      ...stepsSnap.docs.map(d => updateDoc(d.ref, { days:{}, hasProof:{}, verified:{} })),
      ...proofsSnap.docs.map(d => updateDoc(d.ref, { weekProof:{} })),
      ...Object.keys(this.state.users).map(uid => updateDoc(doc(db,'users',uid), { total:0, byWeek:emptyByWeek }).catch(()=>{}))
    ]);
    this.state.config.startDate = null;
    await this.saveConfig();
    this.state.mySteps.days = {};
    this.state.mySteps.hasProof = {};
    this.state.myProofs.weekProof = {};
    Object.values(this.state.users).forEach(u => { u.total = 0; u.byWeek = emptyByWeek.slice(); });
    this.state.allSteps = {};
    this.state.allStepsLoaded = false;
    this.state.viewedProofs = {};
    this.state.allProofs = {};
    this.state.allProofsLoaded = false;
    this.render();
  },

  // ---------- Audit & verify ----------
  pickRandomAudit(){
    // Draws from whatever the admin is currently looking at — everyone, or
    // (with "Show only missing proof" checked) only those with an issue —
    // so the pick is always someone actually visible in the table below,
    // across every team, not just whichever team happens to be expanded.
    let candidates = Object.values(this.state.users);
    if(this.state.participantMissingOnly){
      candidates = candidates.filter(u => this.missingIssues(u).length > 0);
    }
    if(!candidates.length){
      alert(this.state.participantMissingOnly ? 'No one is currently missing proof.' : 'No participants yet.');
      return;
    }
    const u = candidates[Math.floor(Math.random()*candidates.length)];
    // Force that person's team group open — otherwise their row wouldn't
    // exist in the DOM at all to expand or scroll to.
    this.state.expandedParticipantTeams[u.teamId || '__none'] = true;
    this.openParticipantDetail(u.uid);
    // Give the row a moment to render (and its proof photos to start
    // loading) before scrolling to it — it could be anywhere in a long,
    // grouped Participants table.
    setTimeout(() => {
      const row = document.querySelector(`tr[data-uid="${u.uid}"]`);
      if(row) row.scrollIntoView({ block:'center', behavior:'smooth' });
    }, 0);
  },
  // Expands a person's per-week proof/steps detail inline in the
  // Participants table, right below their row — replaces the old separate
  // popup so their photos sit next to their own step counts instead of in
  // a disconnected overlay.
  openParticipantDetail(uid){
    this.state.expandedParticipant = uid;
    this.render();
    this.loadProofsFor(uid).then(() => this.render());
  },
  toggleParticipantDetail(uid){
    if(this.state.expandedParticipant === uid){ this.state.expandedParticipant = null; this.render(); return; }
    this.openParticipantDetail(uid);
  },
  // status is 'verified' | 'rejected' | 'needs_review', or null to clear the
  // review back to pending.
  async setWeekReviewStatus(uid, weekIndex, status){
    const rec = this.state.allSteps[uid];
    if(!rec){ alert("This person hasn't logged any steps yet."); return; }
    const verifiedMap = { ...(rec.verified || {}) };
    if(status){
      verifiedMap[weekIndex] = { status, verifiedBy: this.state.identity.uid, verifiedByName: this.state.identity.name, verifiedAt: new Date().toISOString() };
    } else {
      delete verifiedMap[weekIndex];
    }
    await updateDoc(doc(db,'steps',uid), { verified: verifiedMap });
    rec.verified = verifiedMap;
    this.render();
  },
  // Per-day counterpart to setWeekReviewStatus() — 'correct'/'incorrect' on
  // one specific date, for the proof-review modal (image + day list side by
  // side). Clicking the already-active status again clears it back to
  // unreviewed, same toggle behavior the week-level buttons don't have but
  // this needs since there's no separate "Clear" button per day.
  async setDayReview(uid, date, status){
    const rec = this.state.allSteps[uid];
    if(!rec){ alert("This person hasn't logged any steps yet."); return; }
    const dayReviews = { ...(rec.dayReviews || {}) };
    const existing = dayReviews[date];
    if(existing && existing.status === status){
      delete dayReviews[date];
    } else {
      dayReviews[date] = { status, verifiedBy: this.state.identity.uid, verifiedByName: this.state.identity.name, verifiedAt: new Date().toISOString() };
    }
    await updateDoc(doc(db,'steps',uid), { dayReviews });
    rec.dayReviews = dayReviews;
    this.render();
  },
  openModal(modal){
    this.state.modal = modal;
    this.render();
  },
  closeModal(){ this.state.modal = null; this.render(); },

  // ---------- Render ----------
  render(){
    const root = document.getElementById('app');

    if(!this.state.identity){ root.innerHTML = this.renderLogin(); this.bindLogin(); return; }

        </div></div>
      `;

      <div class="login-wrap"><div class="login-card">

      );
