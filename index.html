      </div>
      <div id="tab-body">
        ${this.state.view==='trail' ? this.renderTrail() : ''}
        ${this.state.view==='myteam' ? this.renderMyTeam() : ''}
        ${this.state.view==='leaderboard' ? this.renderLeaderboard() : ''}
        ${this.state.view==='admin' && me.role==='admin' ? this.renderAdmin() : ''}
      </div>
      ${this.state.modal ? this.renderModal() : ''}
    `;
  },

  renderTrail(){
    const cfg = this.state.config;
    const status = this.getChallengeStatus();
    const myTotal = this.totalStepsOf(this.state.mySteps);

    if(!status.started){
      return `<div class="panel"><div class="empty">${cfg.startDate ? `The challenge starts on ${cfg.startDate} (Singapore time). Check back then.` : "The admin hasn't set a start date yet. Check back soon."}</div></div>`;
    }

    // Start, one stop per week, End — evenly spaced (see .trail-dot-wrap,
    // which gives every stop equal flex so the gaps stay identical instead
    // of the last one shrinking to fit its own content).
    const stops = [{ kind:'start', label:'Start' }];
    for(let w=0; w<cfg.weeks; w++) stops.push({ kind:'week', label:'Week '+(w+1), weekIndex:w });
    stops.push({ kind:'end', label:'End' });

    const stopFilled = (stop) => {
      if(stop.kind === 'start') return true;
      if(stop.kind === 'end') return status.ended;
      return this.totalStepsInRange(this.state.mySteps, stop.weekIndex) > 0;
    };

    let trailHtml = `<div class="trail"><div class="trail-track">`;
    stops.forEach((stop, i) => {
      let dotClass = 'week-dot';
      let otterMarker = '';
      if(stop.kind === 'start'){
        dotClass += ' done';
      } else if(stop.kind === 'end'){
        dotClass += status.ended ? ' done' : ' upcoming';
      } else {
        const weekTotal = this.totalStepsInRange(this.state.mySteps, stop.weekIndex);
        const proof = this.weekProofOf(this.state.mySteps, stop.weekIndex);
        const wStatus = this.getWeekStatus(stop.weekIndex);
        if(weekTotal) dotClass += proof ? ' done' : ' partial';
        if(wStatus === 'editable') dotClass += ' today';
        if(wStatus === 'future') dotClass += ' upcoming';
        otterMarker = wStatus === 'editable' ? `<img class="trail-otter" src="assets/otters/otter-lion.png" alt="">` : '';
      }
      const lineBefore = i>0 ? `<div class="trail-line${stopFilled(stops[i-1])?' filled':''}"></div>` : '<div style="flex:none;width:0;"></div>';
      const lineAfter = i<stops.length-1 ? `<div class="trail-line${stopFilled(stop)?' filled':''}"></div>` : '<div style="flex:none;width:0;"></div>';
      trailHtml += `<div class="trail-dot-wrap">${otterMarker}<div class="trail-line-row">${lineBefore}<div class="${dotClass}"></div>${lineAfter}</div><div class="trail-dot-label">${stop.label}</div></div>`;
    });
    trailHtml += `</div></div>`;

    const funHtml = this.renderFunStats(this.getFunFacts('my', myTotal));

    const myTeam = this.getMyTeam();
    const bonusList = Object.values(this.state.bonus).filter(b => b.active !== false);
    let bonusHtml = '';
    if(bonusList.length){
      bonusHtml = `<div class="panel"><h3>Bonus challenges available</h3>` + bonusList.map(b => {
        const isTeamType = b.type === 'team';
        const awarded = isTeamType
          ? (myTeam ? b.completed.includes(myTeam.id) : false)
          : b.completed.includes(this.state.identity.uid);
        const statusTag = isTeamType && !myTeam
          ? `<span class="tag tag-upcoming">Join a team to work toward this</span>`
          : `<span class="tag ${awarded?'tag-awarded':'tag-pending'}">${awarded?'Awarded':'Not yet awarded'}</span>`;
        return `<div class="challenge-card"><div class="ctop">
          <div><span class="ctitle">${b.title}</span><span class="type-pill">${isTeamType?'Team':'Individual'}</span>${b.description ? `<div class="cdesc">${b.description}</div>` : ''}</div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <span class="points-pill">${b.points} pts</span>
            ${statusTag}
          </div>
        </div></div>`;
      }).join('') + `</div>`;
    }

    const activeWeek = status.ended ? cfg.weeks - 1 : status.weekIndex;
    let weekCards = '<div class="week-list">';
    for(let w=0; w<=activeWeek; w++){
      weekCards += this.renderWeekCard(w);
    }
    weekCards += '</div>';

    return trailHtml + funHtml + bonusHtml + weekCards;
  },

  renderWeekCard(weekIndex){
    const cfg = this.state.config;
    const wStatus = this.getWeekStatus(weekIndex);
    const weekTotal = this.totalStepsInRange(this.state.mySteps, weekIndex);
    const proofEntry = this.weekProofOf(this.state.mySteps, weekIndex);
    const dateRange = cfg.startDate ? this.weekDateRange(weekIndex) : '';
    const isLocked = wStatus === 'locked';

    // Past weeks can't be amended, only viewed — collapsed to a compact
    // status box by default so the page doesn't get long once the challenge
    // starts stacking up locked weeks; click it to review the read-only detail.
    if(isLocked && !this.state.trailExpandedWeeks[weekIndex]){
      const review = this.state.mySteps.verified && this.state.mySteps.verified[weekIndex];
      const reviewStatus = review ? review.status : 'pending';
      return `<div class="locked-week" data-role="toggle-week-expand" data-week="${weekIndex}">
        <div class="locked-week-label">Week ${weekIndex+1}<span class="locked-week-total"> — ${weekTotal.toLocaleString()} steps</span></div>
        <span class="status-pill status-${reviewStatus}">${REVIEW_STATUS_META[reviewStatus].label}</span>
      </div>`;
    }

    let tag = '';
    if(wStatus === 'locked') tag = `<span class="tag tag-locked">Locked</span>`;
    else if(wStatus === 'editable') tag = `<span class="tag tag-editable">Open</span>`;
    else if(wStatus === 'future') tag = `<span class="tag tag-upcoming">Not yet</span>`;

    let proofRow = '';
    if(wStatus === 'editable'){
      proofRow = `<div class="wbody" style="margin-bottom:12px;">
        ${proofEntry ? `<img class="thumb" src="${proofEntry.proof}" data-role="thumb" data-src="${proofEntry.proof}">` : `<div class="thumb-placeholder">no proof</div>`}
        <label class="file-label">${proofEntry ? 'Replace this week’s proof' : 'Upload proof for this week'}<input type="file" accept="image/*" data-week="${weekIndex}" data-role="proof-input"></label>
        ${weekTotal && !proofEntry ? `<span class="tag tag-upcoming">Remember to add proof before the week locks</span>` : ''}
      </div>`;
    } else if(wStatus === 'locked'){
      proofRow = `<div class="wbody" style="margin-bottom:12px;">
        ${proofEntry ? `<img class="thumb" src="${proofEntry.proof}" data-role="thumb" data-src="${proofEntry.proof}">` : `<div class="thumb-placeholder">no proof</div>`}
        <span class="steps-readout">Week total: ${weekTotal.toLocaleString()} steps</span>
      </div>`;
    }

    let dayRows = '';
    if(wStatus === 'editable' || wStatus === 'locked'){
      dayRows = '<div class="day-list">';
      for(let d=0; d<7; d++){
        const i = weekIndex*7 + d;
        const date = this.addDays(cfg.startDate, i);
        const dayStatus = this.getDayStatus(i);
        dayRows += this.renderDayRow(date, dayStatus);
      }
      dayRows += '</div>';
    } else {
      dayRows = `<span class="empty" style="padding:0;">Opens once Week ${weekIndex} finishes.</span>`;
    }

    return `<div class="week-card ${wStatus==='locked'?'locked':''}">
      <div class="wtop"${isLocked ? ` data-role="toggle-week-expand" data-week="${weekIndex}" style="cursor:pointer;"` : ''}><div><span class="wname">Week ${weekIndex+1}</span>${dateRange?`<span class="wdates">${dateRange}</span>`:''}</div><div style="display:flex;align-items:center;gap:8px;">${weekTotal?`<span class="steps-readout">${weekTotal.toLocaleString()} steps</span>`:''}${tag}${isLocked ? '<span style="font-size:11px;color:var(--ink-soft);">▲ Collapse</span>' : ''}</div></div>
      ${proofRow}
      ${dayRows}
    </div>`;
  },

  renderDayRow(date, dayStatus){
    const md = this.formatDate(date);
    const d = new Date(date + 'T00:00:00Z');
    const dow = d.toLocaleDateString('en-US', { weekday:'short', timeZone:'UTC' });
    const entry = this.state.mySteps.days[date];
    const draftSteps = this.state.draftSteps[date];
    const editable = dayStatus === 'editable' || dayStatus === 'editable-today';

    let body = '';
    if(editable){
      const val = draftSteps !== undefined ? draftSteps : (entry ? entry.steps : '');
      body = `
        <input class="steps-input" type="number" min="0" max="${DAILY_STEP_CAP}" placeholder="Steps" value="${val}" data-date="${date}" data-role="steps-input">
        <button class="btn btn-primary btn-sm" data-date="${date}" data-role="save-day">Save</button>
      `;
    } else if(dayStatus === 'locked'){
      body = entry ? `<span class="steps-readout">${entry.steps.toLocaleString()} steps</span>` : `<span class="empty" style="padding:0;">No entry</span>`;
    } else {
      body = `<span class="tag tag-upcoming">Not yet</span>`;
    }

    return `<div class="day-row ${dayStatus==='locked'?'locked':''}">
      <div class="day-date"><div class="dow">${dow}</div><div class="num">${md}</div></div>
      <div class="day-body">${body}</div>
    </div>`;
  },

  // ---------- My Team ----------
  renderMyTeam(){
    if(!this.state.allStepsLoaded) return `<div class="panel"><div class="loading">Loading team info…</div></div>`;
    const team = this.getMyTeam();
    if(!team){
      return `<div class="panel"><div class="empty">You haven't been assigned to a team yet. Ask your admin to add you to one.</div></div>`;
    }
    return this.renderTeamRoster(team);
  },

  renderTeamRoster(team){
    const isCaptain = team.captainUid === this.state.identity.uid;
    const teamTotal = team.members.reduce((s,m)=> s + this.totalStepsOf(this.state.allSteps[m]), 0);
    const funHtml = this.renderFunStats(this.getFunFacts('team', teamTotal, team.id));

    const status = this.getChallengeStatus();
    let raceHtml = '';
    if(status.started){
      const weekIdx = status.ended ? this.state.config.weeks - 1 : status.weekIndex;
      const raceEntries = team.members.map(m => {
        const u = this.state.users[m];
        return { name: u ? u.name : m, value: this.totalStepsInRange(this.state.allSteps[m], weekIdx) };
      });
      raceHtml = `<div class="panel">
        <h3>Week ${weekIdx+1} race</h3>
        <div class="race-row race-axis-row">
          <div class="race-name"></div>
          <div class="race-axis"><span>Start</span><span>Finish</span></div>
        </div>
        ${this.renderRaceTrack(raceEntries, 'assets/otters/otter-lion.png', { unit:'steps' })}
      </div>`;
    }

    const membersHtml = team.members.map(m => {
      const u = this.state.users[m];
      const isCap = m === team.captainUid;
      return `<div class="member-row">
        <div>${u ? u.name : m}${isCap ? '<span class="captain-tag">Captain</span>' : ''}</div>
        ${isCaptain && !isCap ? `<button class="btn btn-sm btn-danger" data-role="remove-member" data-teamid="${team.id}" data-uid="${m}">Remove</button>` : ''}
      </div>`;
    }).join('');

    const bonusList = Object.values(this.state.bonus).filter(b => b.type==='team' && b.active !== false);
    let bonusHtml = '';
    if(bonusList.length){
      bonusHtml = `<div class="panel"><h3>Bonus challenges for your team</h3>` + bonusList.map(b => {
        const awarded = b.completed.includes(team.id);
        return `<div class="challenge-card"><div class="ctop">
          <div><span class="ctitle">${b.title}</span><span class="type-pill">Team</span>${b.description ? `<div class="cdesc">${b.description}</div>` : ''}</div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <span class="points-pill">${b.points} pts</span>
            <span class="tag ${awarded?'tag-awarded':'tag-pending'}">${awarded?'Awarded':'Not yet awarded'}</span>
          </div>
        </div></div>`;
      }).join('') + `</div>`;
    }

    return `
      <div class="panel">
        <h3><img class="header-logo" src="assets/otters/otter-sg.png" alt="">${team.name} <span class="tag tag-open" style="margin-left:8px;">${team.members.length}/${TEAM_SIZE_LIMIT}</span></h3>
        ${membersHtml}
        <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          <div style="font-size:13px;color:var(--ink-soft);">Team total: ${teamTotal.toLocaleString()} steps</div>
          <button class="btn btn-sm" data-role="leave-team">Leave team</button>
        </div>
      </div>
      ${raceHtml}
      ${funHtml}
      ${bonusHtml}
    `;
  },

  // ---------- Leaderboard ----------
  // One dedicated lane per entry (like real swim lanes) so otters never
  // overlap even when scores are close — each otter's position along its
  // lane is relative to the group's current leader, and moves further right
  // as more steps come in, since render() re-derives this from live totals.
  // opts.max overrides the leader used for normalization (e.g. the overall
  // #1, when rendering a subset that excludes the actual leader); opts.unit,
  // when given, shows each entry's raw total under its name.
  renderRaceTrack(entries, otterSrc, opts){
    opts = opts || {};
    if(!entries.length) return `<div class="empty">No one in this race yet.</div>`;
    const max = opts.max || Math.max(1, ...entries.map(e=>e.value));
    return entries.map(e => {
      const pct = Math.min(100, Math.max(2, (e.value/max)*100));
      return `<div class="race-row">
        <div class="race-name">${e.name}${opts.unit ? `<div class="race-value">${e.value.toLocaleString()} ${opts.unit}</div>` : ''}</div>
        <div class="race-lane-track">
          <img class="race-lane-otter" src="${otterSrc}" alt="" style="left:${pct.toFixed(1)}%">
          <div class="race-lane-finish"></div>
        </div>
      </div>`;
    }).join('');
  },

  // Top 3 on a podium (varying heights), everyone else in a compact ranked
  // list that can expand into the same race-lane visualization used above.
  renderPodiumBoard(entries, otterSrc, unit){
    if(!entries.length) return `<div class="empty">No one to rank yet.</div>`;
    const top3 = entries.slice(0,3);
    const rest = entries.slice(3);
    const overallMax = entries[0].value || 1;

    const podiumHtml = `<div class="podium-wrap">${top3.map((e,i) => `
      <div class="podium-block rank-${i+1}">
        <img class="podium-otter" src="${otterSrc}" alt="">
        <div class="podium-rank">${i+1}</div>
        <div class="podium-name">${e.name}</div>
        <div class="podium-value">${e.value.toLocaleString()} ${unit}</div>
      </div>`).join('')}</div>
      <div class="podium-base-bar"></div>`;

    if(!rest.length) return podiumHtml;

    const restHtml = this.state.lbExpanded
      ? `<div class="collapsed-list">${this.renderRaceTrack(rest, otterSrc, { max: overallMax, unit })}</div>`
      : `<div class="collapsed-list">${rest.map((e,i) => `
          <div class="collapsed-row">
            <div class="collapsed-rank">${i+4}</div>
            <div class="collapsed-name">${e.name}</div>
            <div class="collapsed-value">${e.value.toLocaleString()} ${unit}</div>
          </div>`).join('')}</div>`;
    const toggleLabel = this.state.lbExpanded ? 'Hide progress bars' : 'Show progress bars';

    return podiumHtml + restHtml + `<button class="expand-toggle" data-role="toggle-lb-expand">${toggleLabel}</button>`;
  },

  renderLeaderboard(){
    if(!this.state.allStepsLoaded) return `<div class="panel"><div class="loading">Loading leaderboard…</div></div>`;
    const cfg = this.state.config;
    if(this.state.lbTab === null){
      const st = this.getChallengeStatus();
      this.state.lbTab = st.started ? `week-${Math.min(st.weekIndex, cfg.weeks-1)}` : 'week-0';
    }
    let subtabs = '';
    for(let w=0; w<cfg.weeks; w++) subtabs += `<div class="subtab ${this.state.lbTab==='week-'+w?'active':''}" data-lb="week-${w}">Week ${w+1}</div>`;
    subtabs += `<div class="subtab ${this.state.lbTab==='overall'?'active':''}" data-lb="overall">Overall</div>`;

    const sel = this.state.lbTab === 'overall' ? 'overall' : Number(this.state.lbTab.split('-')[1]);
    const unit = sel === 'overall' ? 'pts' : 'steps';

    const teams = Object.values(this.state.teams).map(t => {
      let value = t.members.reduce((s,m)=> s + this.totalStepsInRange(this.state.allSteps[m], sel), 0);
      if(sel === 'overall') value += this.teamBonusPoints(t.id);
      return { id: t.id, name: t.name, value };
    }).sort((a,b)=>b.value-a.value);

    const individuals = Object.values(this.state.users).map(u => {
      let value = this.totalStepsInRange(this.state.allSteps[u.uid], sel);
      if(sel === 'overall') value += this.individualBonusPoints(u.uid);
      return { id: u.uid, name: u.name, value };
    }).sort((a,b)=>b.value-a.value);

    const modeToggle = `<div class="lb-mode-toggle">
      <button class="lb-mode-btn ${this.state.lbMode==='team'?'active':''}" data-role="lb-mode" data-mode="team">Teams</button>
      <button class="lb-mode-btn ${this.state.lbMode==='individual'?'active':''}" data-role="lb-mode" data-mode="individual">Individuals</button>
    </div>`;

    const board = this.state.lbMode === 'team'
      ? this.renderPodiumBoard(teams, 'assets/otters/otter-sg.png', unit)
      : this.renderPodiumBoard(individuals, 'assets/otters/otter-lion.png', unit);

    return `
      <div class="subtabs">${subtabs}</div>
      <div class="panel race-panel">
        ${modeToggle}
        ${board}
      </div>
    `;
  },

  // ---------- Admin ----------
  renderAdmin(){
    const cfg = this.state.config;
    let html = `
      <div class="panel">
        <h3>Challenge settings</h3>
        <div class="config-row">
          <div class="field" style="margin-bottom:0;"><label>Start date (Singapore time)</label><input type="date" id="in-startdate" value="${cfg.startDate || ''}"></div>
          <button class="btn btn-primary" id="btn-save-startdate">Save date</button>
        </div>
        <div class="config-row" style="margin-top:14px;">
          <div class="field" style="margin-bottom:0;"><label>Maximum steps per week (optional)</label><input type="number" id="in-stepslimit" min="1" placeholder="No limit" value="${cfg.stepsLimit || ''}"></div>
          <button class="btn btn-primary" id="btn-save-limit">Save limit</button>
        </div>
        <div style="margin-top:16px;"><button class="btn btn-danger btn-sm" id="btn-reset">Reset challenge data</button></div>
      </div>
    `;

    html += this.renderAdminBonus();
    html += this.renderAdminParticipantTools();

    if(!this.state.allStepsLoaded){
      html += `<div class="panel"><div class="loading">Loading participant status…</div></div>`;
      return html;
    }

    const status = this.getChallengeStatus();
    let users = Object.values(this.state.users).map(u => ({ u, issues: this.missingIssues(u) }));
    users.sort((a,b) => b.issues.length - a.issues.length || a.u.name.localeCompare(b.u.name));

    html += `<div class="panel"><h3>Participants (${users.length}) <span style="font-weight:400;font-size:12px;color:var(--ink-soft);">sorted by missing proof</span></h3>`;
    html += `<div style="margin-bottom:12px;"><button class="btn btn-sm" id="btn-export-participants">Export participants (CSV)</button> <button class="btn btn-sm" id="btn-export-teams">Export teams (CSV)</button> <button class="btn btn-sm" id="btn-random-audit">🎲 Randomly select someone to audit</button></div>`;
    if(!cfg.startDate){
      html += `<div class="empty">Set a start date above to begin tracking weekly status.</div></div>`;
    } else {
      html += `<div class="table-wrap"><table class="roster"><thead><tr><th>Name</th><th>Email</th><th>Team</th>`;
      for(let w=0; w<cfg.weeks; w++) html += `<th>Week ${w+1}</th>`;
      html += `<th>Total</th><th>Flag</th><th>Role</th><th></th></tr></thead><tbody>`;

      users.forEach(({u, issues}) => {
        const rec = this.state.allSteps[u.uid] || { days:{}, weekProof:{} };
        const team = u.teamId ? this.state.teams[u.teamId] : null;
        const total = this.totalStepsOf(rec);
        html += `<tr><td>${u.name}</td><td>${u.email}</td><td>${team ? team.name : '—'}</td>`;
        for(let w=0; w<cfg.weeks; w++){
          const weekTotal = this.totalStepsInRange(rec, w);
          const proof = this.weekProofOf(rec, w);
          const wStatus = this.getWeekStatus(w);
          let cell;
          const review = rec.verified && rec.verified[w];
          const reviewPill = review ? `<span class="status-pill status-${review.status}" style="padding:2px 8px;font-size:10px;">${REVIEW_STATUS_META[review.status].short}</span>` : '';
          if(!weekTotal){
            cell = wStatus === 'locked' ? '<span style="color:var(--rust);">missing</span>' : (wStatus==='editable' ? 'pending' : '—');
          } else {
            cell = weekTotal.toLocaleString() + (proof ? ' ✓' : ' <span style="color:var(--rust);">⚠ no proof</span>') + (reviewPill ? ' ' + reviewPill : '');
          }
          html += `<td class="week-cell">${cell}</td>`;
        }
        html += `<td>${total.toLocaleString()}</td>`;
        html += `<td>${issues.length ? `<span class="tag tag-flag">⚠ ${issues.length}</span>` : ''}</td>`;
        html += `<td><span class="role-pill ${u.role==='admin'?'admin':''}">${u.role}</span></td>`;
        html += `<td style="white-space:nowrap;">
          <button class="btn btn-sm" data-role="view-user" data-uid="${u.uid}">View</button>
          <button class="btn btn-sm" data-role="toggle-role" data-uid="${u.uid}" data-newrole="${u.role==='admin'?'user':'admin'}">${u.role==='admin'?'Demote':'Promote'}</button>
        </td>`;
        html += `</tr>`;
      });
      html += `</tbody></table></div></div>`;
    }

    const teams = Object.values(this.state.teams);
    html += `<div class="panel"><h3>Teams (${teams.length})</h3>`;
    html += teams.length ? teams.map(t => `<div class="team-card">
        <div><div class="tname">${t.name}</div><div class="tmeta">${t.members.length}/${TEAM_SIZE_LIMIT} · captain ${this.state.users[t.captainUid] ? this.state.users[t.captainUid].name : '—'} · ${t.members.map(m=>this.state.users[m]?this.state.users[m].name:m).join(', ')}</div></div>
      </div>`).join('') : `<div class="empty">No teams formed yet.</div>`;
    html += `</div>`;

    html += this.renderAdminProof();

    return html;
  },

  renderAdminProof(){
    const rows = [];
    Object.values(this.state.users).forEach(u => {
      const rec = this.state.allSteps[u.uid];
      if(!rec) return;
      for(let w=0; w<this.state.config.weeks; w++){
        const proof = this.weekProofOf(rec, w);
        if(proof) rows.push({ u, w, proof });
      }
    });
    let html = `<div class="panel"><h3>Proof photos (${rows.length})</h3>`;
    html += `<div style="margin-bottom:12px;"><button class="btn btn-sm" id="btn-export-proof">Export all proof (ZIP)</button></div>`;
    if(!rows.length){
      html += `<div class="empty">No proof photos uploaded yet.</div></div>`;
      return html;
    }
    html += `<div style="display:flex;flex-wrap:wrap;gap:12px;">`;
    rows.forEach(({u,w,proof}) => {
      html += `<div style="width:100px;text-align:center;">
        <img class="thumb" style="width:100px;height:100px;" src="${proof.proof}" data-role="thumb" data-src="${proof.proof}">
        <div style="font-size:11px;color:var(--ink-soft);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${u.name}</div>
        <div style="font-size:10px;color:var(--ink-soft);">Week ${w+1}</div>
      </div>`;
    });
    html += `</div></div>`;
    return html;
  },

  renderAdminParticipantTools(){
    const f = this.state.participantForm;
    const msg = this.state.participantActionMsg;
    let html = `<div class="panel">
      <h3>Add a participant</h3>
      ${msg ? `<div class="notice" style="${msg.type==='error' ? 'background:var(--rust-tint);color:var(--rust);' : ''}">${msg.text}</div>` : ''}
      <div class="form-inline">
        <div class="field" style="margin-bottom:0;flex:1;min-width:160px;"><label>Team name</label><input type="text" id="in-part-team" value="${f.teamName}" placeholder="Trail Blazers"></div>
        <div class="field" style="margin-bottom:0;flex:1;min-width:160px;"><label>Person name</label><input type="text" id="in-part-name" value="${f.personName}" placeholder="Frank Yeo"></div>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft);margin-bottom:8px;"><input type="checkbox" id="in-part-captain" ${f.captain?'checked':''}> Make captain</label>
        <button class="btn btn-primary" id="btn-add-participant">Add</button>
      </div>
      <div style="font-size:12px;color:var(--ink-soft);margin-top:8px;">Creates a new team if it doesn't exist yet (up to 5 people per team). Their username and initial password are shown here once added — the app forces them to change it on first sign-in.</div>
    </div>`;

    html += `<div class="panel">
      <h3>Sync the full roster</h3>
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">
        Columns, in this exact order, no header needed: <code>Team Name, Captain, Member 2, Member 3, Member 4, Member 5</code> (leave later columns blank for smaller teams). <a href="scripts/roster.example.csv" target="_blank" rel="noopener">See an example</a>.
        <br><strong>This replaces the entire roster</strong> — every upload is treated as the full, current list. Anyone missing from it gets unassigned from their team (their profile and step history are kept, not deleted), in case they're re-added on a later upload.
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Upload a CSV file</label><input type="file" accept=".csv,text/csv" id="in-roster-file" ${this.state.rosterImportBusy ? 'disabled' : ''}></div>
      <div class="field" style="margin-bottom:8px;"><label>…or paste the list here instead</label><textarea id="in-roster-paste" rows="5" placeholder="Trail Blazers, Alice Tan, Bob Lee, , ,&#10;Wave Riders, Chris Ong, Dana Lim, Eve Koh, ," ${this.state.rosterImportBusy ? 'disabled' : ''}></textarea></div>
      <button class="btn btn-primary" id="btn-sync-roster" ${this.state.rosterImportBusy ? 'disabled' : ''}>Sync roster</button>
      ${this.state.rosterImportBusy ? `<div class="loading">Syncing…</div>` : ''}
    `;
    const result = this.state.rosterImportResult;
    if(result && result.error){
      html += `<div class="notice" style="background:var(--rust-tint);color:var(--rust);margin-top:10px;">${result.error}</div>`;
    } else if(result){
      html += `<div style="margin-top:10px;font-size:13px;">
        <div>${result.credentials.length} new account(s) created.${result.skipped.length ? ` ${result.skipped.length} row(s) skipped.` : ''}${result.unassigned.length ? ` ${result.unassigned.length} ${result.unassigned.length===1?'person':'people'} unassigned (not in this upload).` : ''}</div>
        ${result.skipped.length ? `<div style="margin-top:6px;"><strong>Skipped rows:</strong><ul style="margin:4px 0;padding-left:18px;color:var(--rust);font-size:12px;">${result.skipped.map(s=>`<li>${s}</li>`).join('')}</ul></div>` : ''}
        ${result.unassigned.length ? `<div style="margin-top:6px;"><strong>Unassigned:</strong> ${result.unassigned.join(', ')}</div>` : ''}
        ${result.credentials.length ? `<button class="btn btn-sm" id="btn-download-roster-creds" style="margin-top:6px;">Download usernames &amp; passwords (CSV)</button>` : ''}
      </div>`;
    }
    html += `</div>`;
    return html;
  },

  renderAdminBonus(){
    const f = this.state.bonusForm;
    let html = `<div class="panel">
      <h3>Bonus challenges</h3>
      <div class="form-inline">
        <div class="field" style="margin-bottom:0;flex:2;min-width:160px;"><label>Title</label><input type="text" id="in-bonus-title" value="${f.title}" placeholder="Weekend hike"></div>
        <div class="field" style="margin-bottom:0;flex:3;min-width:180px;"><label>Description (optional)</label><input type="text" id="in-bonus-desc" value="${f.description}" placeholder="Complete a hike over the weekend"></div>
        <div class="field" style="margin-bottom:0;width:90px;"><label>Points</label><input type="number" id="in-bonus-points" value="${f.points}" min="1"></div>
        <div class="field" style="margin-bottom:0;width:120px;"><label>For</label>
          <select id="in-bonus-type">
            <option value="individual" ${f.type==='individual'?'selected':''}>Individuals</option>
            <option value="team" ${f.type==='team'?'selected':''}>Teams</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btn-add-bonus">Add challenge</button>
      </div>
    </div>`;

    const list = Object.values(this.state.bonus).sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    if(!list.length) return html;

    html += `<div class="panel"><h3>Manage &amp; award challenges</h3>`;
    list.forEach(b => {
      const targets = b.type === 'individual'
        ? Object.values(this.state.users).map(u => ({ id:u.uid, name:u.name }))
        : Object.values(this.state.teams).map(t => ({ id:t.id, name:t.name }));
      html += `<div class="challenge-card">
        <div class="ctop">
          <div><span class="ctitle">${b.title}</span><span class="type-pill">${b.type==='individual'?'Individual':'Team'}</span>${b.active===false?'<span class="type-pill">Disabled</span>':''}${b.description?`<div class="cdesc">${b.description}</div>`:''}</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="points-pill">${b.points} pts</span>
            <button class="btn btn-sm" data-role="toggle-bonus-active" data-id="${b.id}">${b.active===false?'Enable':'Disable'}</button>
            <button class="btn btn-sm btn-danger" data-role="delete-bonus" data-id="${b.id}">Delete</button>
          </div>
        </div>
        ${targets.length > 8 ? `<div class="field" style="margin-bottom:0;margin-top:10px;max-width:280px;"><input type="text" data-role="bonus-filter" placeholder="Filter by ${b.type==='individual'?'name':'team name'}…"></div>` : ''}
        <div class="award-grid">
          ${targets.length ? targets.map(t => `<div class="award-chip ${b.completed.includes(t.id)?'awarded':''}" data-role="toggle-award" data-id="${b.id}" data-target="${t.id}" data-name="${t.name.toLowerCase()}">${b.completed.includes(t.id)?'✓ ':''}${t.name}</div>`).join('') : `<span class="empty" style="padding:0;">No ${b.type==='individual'?'participants':'teams'} yet.</span>`}
        </div>
      </div>`;
    });
    html += `</div>`;
    return html;
  },

  renderModal(){
    const m = this.state.modal;
    if(m.type === 'image'){
      return `<div class="modal-overlay" data-role="modal-overlay"><div class="modal">
        <button class="modal-close" data-role="modal-close">&times;</button>
        <div class="serif" style="font-size:16px;">Proof</div>
        <img src="${m.src}">
      </div></div>`;
    }
    if(m.type === 'userDetail'){
      const u = this.state.users[m.uid];
      const rec = this.state.allSteps[m.uid] || { days:{}, weekProof:{} };
      const cfg = this.state.config;
      const isAdmin = (this.state.users[this.state.identity.uid] || {}).role === 'admin';

      let weekBlocks = '';
      for(let w=0; w<cfg.weeks; w++){
        const weekTotal = this.totalStepsInRange(rec, w);
        const proof = this.weekProofOf(rec, w);
        const review = rec.verified && rec.verified[w];
        const reviewStatus = review ? review.status : 'pending';

        let dayRows = '';
        if(cfg.startDate){
          for(let d=0; d<7; d++){
            const date = this.addDays(cfg.startDate, w*7 + d);
            const entry = rec.days[date];
            dayRows += `<tr><td>${this.formatDate(date)}</td><td>${entry ? entry.steps.toLocaleString() : '—'}</td></tr>`;
          }
        }

        const auditKey = m.uid + ':' + w;
        const audit = this.state.auditResults[auditKey];
        let auditHtml = '';
        if(audit && audit.loading){
          auditHtml = `<div class="loading" style="padding:8px 0;">Checking photo against logged steps…</div>`;
        } else if(audit && audit.error){
          auditHtml = `<div class="notice" style="margin:10px 0;">${audit.error}</div>`;
        } else if(audit && audit.result){
          const flags = (audit.result.flags || []).filter(f => f.issue);
          auditHtml = `<div style="margin:10px 0;font-size:13px;">
            ${audit.result.summary ? `<div style="margin-bottom:6px;color:var(--ink-soft);">${audit.result.summary}</div>` : ''}
            ${flags.length
              ? flags.map(f => `<div class="tag tag-flag" style="display:block;margin-bottom:4px;">⚠ ${f.date}: claimed ${f.claimedSteps ?? '—'}, photo shows ${f.seenInPhoto ?? 'unclear'} — ${f.issue}</div>`).join('')
              : `<span class="tag tag-awarded">No mismatches found</span>`}
          </div>`;
        }

        weekBlocks += `<div class="week-card" style="margin-top:12px;">
          <div class="wtop">
            <div><span class="wname">Week ${w+1}</span></div>
            <div style="display:flex;align-items:center;gap:8px;">
              ${weekTotal?`<span class="steps-readout">${weekTotal.toLocaleString()} steps</span>`:''}
              <span class="status-pill status-${reviewStatus}">${REVIEW_STATUS_META[reviewStatus].label}</span>
            </div>
          </div>
          <div class="wbody" style="margin-bottom:6px;">
            ${proof ? `<img class="thumb" src="${proof.proof}" data-role="thumb" data-src="${proof.proof}">` : `<div class="thumb-placeholder">no proof</div>`}
            ${isAdmin ? `<button class="btn btn-sm" data-role="audit-week" data-uid="${m.uid}" data-week="${w}" ${(!proof || !weekTotal) ? 'disabled' : ''}>🤖 Check with AI</button>` : ''}
          </div>
          ${isAdmin ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
            ${['verified','needs_review','rejected'].map(s => `<button class="btn btn-sm" data-role="set-review" data-uid="${m.uid}" data-week="${w}" data-status="${s}"
              style="${reviewStatus===s ? `background:${REVIEW_STATUS_META[s].bg};border-color:${REVIEW_STATUS_META[s].bg};color:${REVIEW_STATUS_META[s].fg};` : ''}">${REVIEW_STATUS_META[s].short}</button>`).join('')}
            ${review ? `<button class="btn btn-sm" data-role="set-review" data-uid="${m.uid}" data-week="${w}" data-status="">Clear</button>` : ''}
          </div>` : ''}
          ${auditHtml}
          ${dayRows ? `<table><thead><tr><th>Day</th><th>Steps</th></tr></thead><tbody>${dayRows}</tbody></table>` : ''}
        </div>`;
      }

      return `<div class="modal-overlay" data-role="modal-overlay"><div class="modal">
        <button class="modal-close" data-role="modal-close">&times;</button>
        <div class="serif" style="font-size:18px;">${u.name}</div>
        <div style="color:var(--ink-soft);font-size:13px;">${u.email}</div>
        ${weekBlocks}
      </div></div>`;
    }
    return '';
  },

  bindApp(){
    const root = document.getElementById('app');

    const switchBtn = document.getElementById('btn-switch');
    if(switchBtn) switchBtn.addEventListener('click', () => this.switchIdentity());

    root.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => this.setView(el.dataset.view)));
    root.querySelectorAll('.subtab').forEach(el => el.addEventListener('click', () => { this.state.lbTab = el.dataset.lb; this.render(); }));
    root.querySelectorAll('[data-role="lb-mode"]').forEach(el => el.addEventListener('click', () => { this.state.lbMode = el.dataset.mode; this.state.lbExpanded = false; this.render(); }));
    root.querySelectorAll('[data-role="toggle-lb-expand"]').forEach(el => el.addEventListener('click', () => { this.state.lbExpanded = !this.state.lbExpanded; this.render(); }));

    root.querySelectorAll('[data-role="toggle-week-expand"]').forEach(el => el.addEventListener('click', () => {
      const w = Number(el.dataset.week);
      this.state.trailExpandedWeeks[w] = !this.state.trailExpandedWeeks[w];
      this.render();
    }));
    root.querySelectorAll('[data-role="save-day"]').forEach(el => el.addEventListener('click', () => this.saveDay(el.dataset.date)));
    root.querySelectorAll('[data-role="steps-input"]').forEach(el => el.addEventListener('input', () => this.state.draftSteps[el.dataset.date] = el.value));
    root.querySelectorAll('[data-role="proof-input"]').forEach(el => el.addEventListener('change', () => this.handleWeekProofFile(Number(el.dataset.week), el)));
    root.querySelectorAll('[data-role="thumb"]').forEach(el => el.addEventListener('click', () => this.openModal({ type:'image', src: el.dataset.src })));

    const startDateBtn = document.getElementById('btn-save-startdate');
    if(startDateBtn) startDateBtn.addEventListener('click', () => {
      const val = document.getElementById('in-startdate').value;
      if(val) this.setStartDate(val);
    });
    const limitBtn = document.getElementById('btn-save-limit');
    if(limitBtn) limitBtn.addEventListener('click', () => this.setStepsLimit(document.getElementById('in-stepslimit').value));
    const resetBtn = document.getElementById('btn-reset');
    if(resetBtn) resetBtn.addEventListener('click', () => this.resetChallenge());

    const exportP = document.getElementById('btn-export-participants');
    if(exportP) exportP.addEventListener('click', () => this.exportParticipantsCSV());
    const exportT = document.getElementById('btn-export-teams');
    if(exportT) exportT.addEventListener('click', () => this.exportTeamsCSV());
    const randomAuditBtn = document.getElementById('btn-random-audit');
    if(randomAuditBtn) randomAuditBtn.addEventListener('click', () => this.pickRandomAudit());
    const exportProofBtn = document.getElementById('btn-export-proof');
    if(exportProofBtn) exportProofBtn.addEventListener('click', () => this.exportProofZip());

    const addParticipantBtn = document.getElementById('btn-add-participant');
    if(addParticipantBtn){
      addParticipantBtn.addEventListener('click', () => {
        this.state.participantForm = {
          teamName: document.getElementById('in-part-team').value,
          personName: document.getElementById('in-part-name').value,
          captain: document.getElementById('in-part-captain').checked
        };
        this.addParticipant(this.state.participantForm.teamName, this.state.participantForm.personName, this.state.participantForm.captain);
      });
    }
    const syncRosterBtn = document.getElementById('btn-sync-roster');
    if(syncRosterBtn){
      syncRosterBtn.addEventListener('click', async () => {
        const file = document.getElementById('in-roster-file').files[0];
        const pasted = document.getElementById('in-roster-paste').value;
        if(!file && !pasted.trim()){ alert('Choose a CSV file or paste the list first.'); return; }
        if(!confirm('This replaces the entire roster with what you\'re about to upload — anyone not in it will be unassigned from their team. Continue?')) return;
        const text = file ? await file.text() : pasted;
        this.syncRoster(text);
      });
    }
    const downloadCredsBtn = document.getElementById('btn-download-roster-creds');
    if(downloadCredsBtn) downloadCredsBtn.addEventListener('click', () => this.downloadRosterCredentials());

    root.querySelectorAll('[data-role="toggle-role"]').forEach(el => el.addEventListener('click', () => this.setRole(el.dataset.uid, el.dataset.newrole)));
    root.querySelectorAll('[data-role="view-user"]').forEach(el => el.addEventListener('click', () => this.openModal({ type:'userDetail', uid: el.dataset.uid })));
    root.querySelectorAll('[data-role="audit-week"]').forEach(el => el.addEventListener('click', () => this.runAiAudit(el.dataset.uid, Number(el.dataset.week))));
    root.querySelectorAll('[data-role="set-review"]').forEach(el => el.addEventListener('click', () => {
      this.setWeekReviewStatus(el.dataset.uid, Number(el.dataset.week), el.dataset.status || null);
    }));

    root.querySelectorAll('[data-role="modal-close"], [data-role="modal-overlay"]').forEach(el => {
      el.addEventListener('click', (e) => { if(e.target === el) this.closeModal(); });
    });

    root.querySelectorAll('[data-role="remove-member"]').forEach(el => el.addEventListener('click', () => this.removeMember(el.dataset.teamid, el.dataset.uid)));
    const leaveBtn = root.querySelector('[data-role="leave-team"]');
    if(leaveBtn) leaveBtn.addEventListener('click', () => this.leaveTeam());

    const addBonusBtn = document.getElementById('btn-add-bonus');
    if(addBonusBtn) addBonusBtn.addEventListener('click', () => {
      this.state.bonusForm = {
        title: document.getElementById('in-bonus-title').value,
        description: document.getElementById('in-bonus-desc').value,
        points: document.getElementById('in-bonus-points').value,
        type: document.getElementById('in-bonus-type').value
      };
      this.addBonusChallenge();
    });
    root.querySelectorAll('[data-role="toggle-bonus-active"]').forEach(el => el.addEventListener('click', () => this.toggleBonusActive(el.dataset.id)));
    root.querySelectorAll('[data-role="delete-bonus"]').forEach(el => el.addEventListener('click', () => this.deleteBonusChallenge(el.dataset.id)));
    root.querySelectorAll('[data-role="toggle-award"]').forEach(el => el.addEventListener('click', () => this.toggleAward(el.dataset.id, el.dataset.target)));
    root.querySelectorAll('[data-role="bonus-filter"]').forEach(input => {
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        const grid = input.closest('.challenge-card').querySelector('.award-grid');
        if(!grid) return;
        grid.querySelectorAll('.award-chip').forEach(chip => {
          chip.style.display = (q !== '' && !chip.dataset.name.includes(q)) ? 'none' : '';
        });
      });
    });
  }
};

window.App = App;
App.init();
</script>
</body>
</html>
