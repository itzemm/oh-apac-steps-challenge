services:
  - type: web
    name: oh-apac-steps-challenge
    runtime: static
    buildCommand: "echo 'static site, no build step needed'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

# There used to be a second Node service here (oh-apac-steps-audit) holding
# Firebase Admin SDK access for participant management, and an AI photo-audit
# feature backed by a Gemini key. Both are gone now: participant management
# runs client-side (see ensureUserClient() in index.html, gated by
# firestore.rules), and the AI audit feature was removed entirely. See the
# README's "Provisioning accounts" section.
