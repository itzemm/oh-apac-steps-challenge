services:
  - type: web
    name: oh-apac-steps-challenge
    runtime: static
    buildCommand: "echo 'static site, no build step needed'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

# The Gemini API key and Firebase Admin SDK access used to live in a second
# Node service here (oh-apac-steps-audit). That's been retired in favor of
# Cloud Functions (see /functions) — same "never let the browser see these
# secrets" job, but running inside the Firebase project instead of a
# separately-billed Render service. Deploy those with:
#   npx firebase-tools deploy --only functions
