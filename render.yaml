services:
  - type: web
    name: oh-apac-steps-challenge
    runtime: static
    buildCommand: "echo 'static site, no build step needed'"
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

# There used to be a second Node service here (oh-apac-steps-audit) holding
# the Gemini API key and Firebase Admin SDK access. Both were retired to keep
# this project entirely free with no billing account required anywhere:
# participant management now runs client-side (see ensureUserClient() in
# index.html, gated by firestore.rules), and the Gemini key is a restricted,
# domain-locked key embedded directly in index.html. See the README's
# "AI proof-photo audits" and "Provisioning accounts" sections.
